LESSONS.push({
  id:`r11`, code:`ELA.6.R.1.1`, cat:`pp`, title:`Character Interactions Drive the Plot`,
  std:`Analyze how the interaction between characters contributes to the development of a plot in a literary text.`,
  learn:[
    `<p><b>Plot</b> is the chain of events in a story: exposition → rising action → climax (turning point) → falling action → resolution.</p>`,
    `<p>Characters don't just stand around in a plot. They <b>interact</b>: they argue, help, misunderstand, tease, apologize, compete. Those interactions <b>cause</b> what happens next. FAST asks: “How does the interaction between ___ and ___ contribute to the plot?”</p>`,
    `<table class="tbl"><tr><th>❌ Surface answer</th><th>✔ Strong answer</th></tr><tr><td>“Jaylen and Priya argue about the project.”</td><td>“Their argument <b>creates the conflict</b> that drives the story, because they stop working together.”</td></tr></table>`,
    `<p>A strong answer always has two parts: <b>the interaction</b> + <b>its effect on the plot</b> (creates conflict, raises tension, causes a decision, leads to the turning point, resolves the problem).</p>`
  ],
  move:{name:`The Because-So Chain`, steps:[`What happened <b>between</b> the characters? (words, actions)`,`How did each one <b>react or feel</b>?`,`What <b>changed</b> because of it? (a decision, a new problem, a turning point)`,`Say it as a chain: “<b>Because</b> ___ said/did ___, <b>so</b> ___ happened.”`,`Pick the answer that has the interaction AND the effect.`]},
  model:{title:`Watch me do it`, passage:[`Kenji laughed when his best friend Omar tripped during the relay race. Omar didn't say a word. The next day, Omar asked to switch to a different relay team, and Kenji found himself running the anchor leg with three kids he barely knew.`],
    think:[
      {s:`Interaction`, t:`Kenji laughs at Omar when he trips.`},
      {s:`Reaction`, t:`Omar is silent. He's hurt or embarrassed.`},
      {s:`Change`, t:`Omar switches teams.`},
      {s:`Chain`, t:`<b>Because</b> Kenji laughed at Omar, <b>so</b> Omar left the team, which creates a <b>new conflict</b> for Kenji: he's alone, and the friendship is damaged. That's how the interaction moves the plot forward.`}
    ]},
  guided:[
    {s:`Maya borrows her sister's jacket without asking and spills juice on it. When her sister finds out, she refuses to drive Maya to the school dance. How does the interaction contribute to the plot?`, o:[[`It creates a new problem: Maya now has no ride to the dance.`,1],[`It shows that Maya likes her sister's jacket.`,`CHAR_SURFACE`,`That's a detail, not an effect on the plot.`],[`It shows that juice stains clothing.`,`TRUE_NOT_TEXT`,`That's not about the plot.`],[`Maya and her sister argue.`,`CHAR_SURFACE`,`That just retells it. What happens BECAUSE of it?`]], h:`Because Maya ruined the jacket, so...?`, w:`The interaction causes a consequence (no ride), which raises the conflict.`},
    {s:`Which answer BEST explains how an interaction contributes to a story's turning point?`, o:[[`When the coach finally tells Ella she believed in her all along, Ella decides not to quit the team.`,1],[`Ella and the coach talk after practice.`,`CHAR_SURFACE`,`What changes because of the talk?`],[`The coach wears a whistle.`,`CHAR_SURFACE`,`Not an interaction.`],[`Ella likes basketball.`,`CHAR_SURFACE`,`That's a character trait, not an interaction.`]], h:`A turning point is when a big decision or change happens.`, w:`The coach's words cause Ella's big decision, and that's the turning point.`},
    {s:`Two rivals, Drew and Sam, are forced to share a canoe at camp. They argue until the canoe tips over. Then they have to work together to swim it back to shore. What role does tipping over play in the plot?`, o:[[`It's a turning point that forces the rivals to cooperate.`,1],[`It shows that canoes are dangerous.`,`TRUE_NOT_TEXT`,`The story's focus is the boys' relationship.`],[`It ends the story right away.`,`TRUE_NOT_TEXT`,`They still have to swim back. The story continues.`],[`It shows Drew and Sam argue.`,`CHAR_SURFACE`,`What does the accident CHANGE?`]], h:`What changes after the canoe tips?`, w:`Their arguing causes a crisis, and the crisis forces teamwork. That changes their relationship.`}
  ],
  check:{title:`The Science Fair Partner`, passages:[{title:`The Science Fair Partner`, paras:[
    `When Ms. Varga read the science fair partner list aloud, Jaylen groaned so loudly that three people turned around. He had been paired with Priya Natarajan, who color-coded her notes, raised her hand before questions were finished, and once corrected the substitute teacher's spelling of “photosynthesis.”`,
    `“We should test whether music affects plant growth,” Priya said at their first meeting, already opening a spreadsheet. “I’ve made a schedule.”`,
    `“Or,” said Jaylen, “we could build a volcano and be done in a day.”`,
    `Priya looked at him the way his mother looked at muddy shoes on the carpet. “A volcano isn’t an experiment. It’s a demonstration.”`,
    `For the next two weeks, they barely spoke. Priya watered the plants, measured them, and recorded the data. Jaylen showed up late, played music for the plants on his phone, and left early. When his friend Marcus asked how the project was going, Jaylen shrugged. “Priya’s doing it. She doesn’t need me.” He didn’t notice that Priya was standing at the water fountain a few feet away.`,
    `The next afternoon, Jaylen found the plants on the windowsill and a note in Priya's neat handwriting: <em>You’re right. I don’t need you. I’ll tell Ms. Varga I worked alone.</em>`,
    `Jaylen read the note three times. He had expected to feel relieved, but instead he felt something closer to embarrassment. He remembered how Priya had stayed after school to measure the plants when he went to basketball practice, how she had never once complained to the teacher. He looked at the data table taped to the window. Half of the boxes for the “music group” were empty. Those were the days he was supposed to play the songs.`,
    `That night, Jaylen made a playlist of exactly thirty minutes, set alarms on his phone, and wrote a list of everything he had skipped. The next morning, he was waiting outside the classroom before Priya arrived.`,
    `“I messed up,” he said, holding out his list. “The music data is missing because of me. If we start over with new seedlings this week, I’ll do every music session. Every single one.”`,
    `Priya studied him for a long moment. Then she took the list, uncapped a green highlighter, and handed him a second one. “Green is for your jobs,” she said. “Don’t be late.”`,
    `Three weeks later, their poster, “Does Music Help Plants Grow?”, earned an honorable mention. Their conclusion was that the music made no measurable difference. Jaylen thought that was funny. The plants hadn’t changed much at all, but he had.`
  ]}],
  qs:[
    {type:`ab`, a:{s:`<b>Part A:</b> How does the interaction between Jaylen and Priya in paragraphs 2–4 contribute to the plot?`, o:[[`It sets up the conflict, their very different attitudes toward the project, which drives the rest of the story.`,1],[`It shows that Priya is the best student in the class.`,`CHAR_SURFACE`],[`It explains why volcanoes are not real experiments.`,`DETAIL_CENTRAL`],[`It solves the problem between the two partners.`,`TRUE_NOT_TEXT`]], w:`Priya wants a careful experiment; Jaylen wants the easy way out. That difference is the conflict.`},
      b:{s:`<b>Part B:</b> Which quotation BEST supports the answer to Part A?`, o:[[`“Or,” said Jaylen, “we could build a volcano and be done in a day.”`,1],[`“When Ms. Varga read the science fair partner list aloud”`,`PART_AB`],[`“Three weeks later, their poster . . . earned an honorable mention.”`,`PART_AB`],[`“He had expected to feel relieved”`,`PART_AB`]], w:`Jaylen's quick, lazy idea right after Priya's detailed schedule shows how differently they see the project.`}},
    {s:`What effect does Priya overhearing Jaylen in paragraph 5 have on the plot?`, o:[[`It leads her to write the note, which forces Jaylen to face how he has treated her.`,1],[`It causes Priya to quit science forever.`,`TRUE_NOT_TEXT`],[`It makes Marcus join the project.`,`TRUE_NOT_TEXT`],[`It shows that Priya was getting a drink of water.`,`CHAR_SURFACE`]], w:`Because Priya heard him, she wrote the note, so Jaylen had to face his behavior. Cause → effect.`},
    {s:`Which event is the turning point of the story?`, o:[[`Jaylen reads Priya's note and realizes he has let her down.`,1],[`Ms. Varga reads the partner list aloud.`,`CHAR_SURFACE`],[`The poster earns an honorable mention.`,`CHAR_SURFACE`],[`Jaylen plays music for the plants on his phone.`,`CHAR_SURFACE`]], w:`Reading the note is when Jaylen's feelings and actions change direction. That's the climax.`},
    {s:`How does Priya's response in paragraph 10 contribute to the resolution?`, o:[[`By giving Jaylen a highlighter and his own jobs, she accepts his apology, and they become real partners.`,1],[`It shows she is still angry and wants to work alone.`,`TRUE_NOT_TEXT`],[`It shows that her favorite color is green.`,`CHAR_SURFACE`],[`It shows she will do all the work again.`,`TRUE_NOT_TEXT`]], w:`Handing him a highlighter = trusting him again. Their conflict is resolved through this interaction.`},
    {type:`multi`, n:2, s:`Select <b>TWO</b> details that show how Jaylen changes because of his interactions with Priya.`, o:[[`“made a playlist of exactly thirty minutes, set alarms on his phone”`,1],[`“he was waiting outside the classroom before Priya arrived”`,1],[`“Jaylen groaned so loudly that three people turned around”`,`CHAR_SURFACE`],[`“showed up late, played music for the plants on his phone, and left early”`,`CHAR_SURFACE`],[`“Jaylen thought that was funny”`,`WORD_MATCH`]], w:`Both show the NEW, responsible Jaylen. Choices C and D show him BEFORE he changed.`}
  ]}
});

LESSONS.push({
  id:`r12`, code:`ELA.6.R.1.2`, cat:`pp`, title:`Theme: How the Message Grows`,
  std:`Analyze the development of stated or implied theme(s) throughout a literary text.`,
  learn:[
    `<p>A <b>theme</b> is the message about life that a story teaches. It is usually <b>implied</b> (not stated), so you have to figure it out from what happens.</p>`,
    `<table class="tbl"><tr><th>Topic (1 word)</th><th>Theme (full sentence)</th></tr><tr><td>Responsibility</td><td>Being a good partner means owning your mistakes and doing your share.</td></tr><tr><td>Mistakes</td><td>Mistakes are part of learning, and imperfect work can show how far you've come.</td></tr></table>`,
    `<h4>Three rules for a strong theme</h4><ol><li>It's a <b>sentence</b>, not a word.</li><li>It works for <b>anyone</b>: no character names, no plot details.</li><li>It's <b>supported</b> by the beginning, middle, AND end.</li></ol>`,
    `<p><b>Development</b> = how the theme grows. Beginning: the character believes or wants something. Middle: the conflict tests that belief. End: the character changes or learns, and that reveals the theme. Clues: what the main character learns, the title, symbols (an object that stands for an idea), repeated words, and the last lines.</p>`
  ],
  move:{name:`Topic + Lesson + Proof`, steps:[`Name the <b>topic</b> in one word.`,`What did the main character <b>learn</b> about it? (Look at how they changed.)`,`Turn it into a sentence about <b>people in general</b>.`,`Find <b>proof</b> in the beginning, middle, and end.`]},
  model:{title:`Watch me do it (using “The Science Fair Partner”)`, passage:[`Remember Jaylen? He started out letting Priya do everything, overheard saying “She doesn't need me,” read her note, felt embarrassed, apologized, and did his share. The last line: “The plants hadn’t changed much at all, but he had.”`],
    think:[
      {s:`Topic`, t:`Responsibility (or teamwork).`},
      {s:`Lesson`, t:`Jaylen learned he had to own his mistake and do his part.`},
      {s:`Sentence`, t:`<em>Being a good teammate means taking responsibility for your mistakes and doing your share.</em> No names. Works for anyone. ✔`},
      {s:`Proof`, t:`Beginning: he skips work. Middle: the note makes him face it. End: alarms, apology, “he had [changed].” The theme develops through the whole story.`}
    ]},
  guided:[
    {s:`Which is a THEME, not just a topic?`, o:[[`Friendships grow stronger when people forgive each other.`,1],[`Friendship`,`TOPIC_THEME`,`That's a topic. What does the story SAY about friendship?`],[`Two friends and a fight`,`TOPIC_THEME`,`That's a summary, not a message.`],[`Lily should forgive Ava.`,`PLOT_THEME`,`Too specific: it uses names. Make it work for anyone.`]], h:`A theme is a full sentence that works for anyone.`, w:`It's a sentence, it has no names, and it teaches a lesson about life.`},
    {s:`In a story, a boy brags that he never needs help. During a camping trip, he gets lost and must rely on a classmate he teased. At the end, he thanks her. What is the theme?`, o:[[`Everyone needs help sometimes, and accepting it takes humility.`,1],[`Camping`,`TOPIC_THEME`,`That's a topic.`],[`Don't get lost in the woods.`,`PLOT_THEME`,`That's too tied to the plot. What did he learn about himself and others?`],[`Classmates are mean.`,`TRUE_NOT_TEXT`,`The classmate helped him!`]], h:`How did he CHANGE from beginning to end?`, w:`He goes from “I never need help” to thanking someone. That change shows the theme.`},
    {s:`How does the END of a story usually help develop a theme?`, o:[[`It shows what the character learned or how they changed, revealing the message.`,1],[`It always states the theme in bold words.`,`TRUE_NOT_TEXT`,`Themes are usually implied, not stated.`],[`It introduces the main characters.`,`CHAR_SURFACE`,`That's the beginning (exposition).`],[`It has nothing to do with the theme.`,`TRUE_NOT_TEXT`,`Endings are one of the best theme clues!`]], h:`Where do characters finally show what they learned?`, w:`Endings show the result of the character's journey. That's where the lesson becomes clear.`}
  ],
  check:{title:`The Crooked Bowl`, passages:[{title:`The Crooked Bowl`, paras:[
    `Mateo’s first bowl collapsed before it was even a bowl. One moment the clay was rising smoothly between his hands on the spinning wheel; the next, it folded over like a tired flower and slumped into a gray heap.`,
    `“Again,” said his grandmother, Yaya, without looking up from her own wheel. She had been a potter for fifty years, and her shelves were lined with bowls so smooth and even that they looked as if a machine had made them.`,
    `Mateo tried again. And again. By the end of the week, he had made exactly one bowl that did not collapse, and it leaned to one side like a boat taking on water. He hid it behind a bag of clay so Yaya would not see.`,
    `She found it anyway. She turned it slowly in her hands, the way she inspected everything. “It leans,” she said.`,
    `“I know,” Mateo muttered. “It’s terrible. I’m going to smash it and start over.”`,
    `Instead of answering, Yaya walked to the highest shelf in the studio and took down a bowl he had never noticed. It was lopsided, thicker on one side than the other, and a jagged line of gold ran down its side where it had once cracked and been glued back together.`,
    `“My first bowl,” she said. “Your grandfather dropped it the week we were married. I almost threw the pieces away. Then I decided to fill the crack with gold paint instead.”`,
    `Mateo frowned. “But it’s still crooked. And it’s broken.”`,
    `“It is,” Yaya agreed. “And every time I look at it, I remember that I was once a beginner, that I kept going anyway, and that something broken can still be worth keeping.” She set it beside his leaning bowl. “Fifty years from now, which one of these do you think you’ll want to see?”`,
    `Mateo didn’t smash his bowl. He fired it in the kiln, glazed it a deep ocean blue, and gave it a place on the high shelf next to hers. Over the next year, his bowls grew taller, thinner, more even. Some cracked, and some collapsed, and he made each one again.`,
    `But whenever a new bowl folded on the wheel, he glanced up at the two crooked ones on the high shelf, took a breath, and said to himself what Yaya had said to him on the very first day: “Again.”`
  ]}],
  qs:[
    {type:`ab`, a:{s:`<b>Part A:</b> Which statement BEST expresses a theme of the story?`, o:[[`Mistakes are part of learning, and imperfect early work can be worth keeping because it shows how far you've come.`,1],[`Pottery`,`TOPIC_THEME`],[`Mateo should not smash his leaning bowl.`,`PLOT_THEME`],[`Grandparents are always right about everything.`,`TOO_BROAD`]], w:`It's a full sentence, works for anyone, and is supported from beginning to end.`},
      b:{s:`<b>Part B:</b> Which quotation BEST supports the answer to Part A?`, o:[[`“I remember that I was once a beginner, that I kept going anyway, and that something broken can still be worth keeping.”`,1],[`“her shelves were lined with bowls so smooth and even that they looked as if a machine had made them”`,`PART_AB`],[`“He hid it behind a bag of clay so Yaya would not see.”`,`PART_AB`],[`“glazed it a deep ocean blue”`,`PART_AB`]], w:`Yaya almost states the theme directly here.`}},
    {s:`How does the beginning of the story (paragraphs 1–5) help develop the theme?`, o:[[`It shows Mateo's frustration and his belief that imperfect work should be destroyed, setting up the lesson he will learn.`,1],[`It shows that Mateo is already an expert potter.`,`TRUE_NOT_TEXT`],[`It explains how a potter's wheel works.`,`DETAIL_CENTRAL`],[`It states the theme directly in the first sentence.`,`TRUE_NOT_TEXT`]], w:`At the start, Mateo wants to smash his imperfect bowl. That belief is what the story will change.`},
    {s:`How does Yaya's gold-lined bowl contribute to the theme?`, o:[[`It is a symbol showing that something flawed or broken can still have value and meaning.`,1],[`It shows that gold paint is expensive.`,`LITERAL_FIG`],[`It shows that Yaya is a better potter than Mateo.`,`CHAR_SURFACE`],[`It shows that Mateo's grandfather was careless.`,`DETAIL_CENTRAL`]], w:`The bowl is a symbol: broken and crooked, yet treasured. It stands for the lesson Mateo learns.`},
    {s:`How does the ending (paragraphs 10–11) develop the theme?`, o:[[`Mateo keeps his bowl and uses the word “Again” to keep going after failures, showing he has learned the lesson.`,1],[`Mateo decides to quit pottery.`,`TRUE_NOT_TEXT`],[`Mateo's bowls become perfect, so mistakes no longer matter.`,`HALF_RIGHT`],[`It shows that the shelf is very high.`,`LITERAL_FIG`]], w:`He still fails (“some cracked”) but keeps going. Choice C is half right: his bowls improve, but the story never says mistakes stop mattering.`},
    {type:`multi`, n:2, s:`The word “Again” appears at the beginning and the end of the story. Select <b>TWO</b> details that show how this word helps develop the theme of persistence.`, o:[[`“‘Again,’ said his grandmother, Yaya, without looking up from her own wheel.”`,1],[`“took a breath, and said to himself what Yaya had said to him on the very first day: ‘Again.’”`,1],[`“a jagged line of gold ran down its side”`,`DETAIL_CENTRAL`],[`“it folded over like a tired flower”`,`DETAIL_CENTRAL`],[`“She had been a potter for fifty years”`,`DETAIL_CENTRAL`]], w:`At first “Again” is Yaya's instruction. At the end Mateo says it to HIMSELF, which shows he has made the lesson his own.`}
  ]}
});

LESSONS.push({
  id:`r13`, code:`ELA.6.R.1.3`, cat:`pp`, title:`Narrators & Point-of-View Shifts`,
  std:`Explain the influence of multiple narrators and/or shifts in point of view in a literary text.`,
  learn:[
    `<p>The <b>narrator</b> is the one telling the story. <b>Point of view</b> tells you how much the narrator knows.</p>`,
    `<table class="tbl"><tr><th>Point of view</th><th>Clue</th><th>What the narrator knows</th></tr><tr><td>First person</td><td>I, me, we</td><td>Only their OWN thoughts and feelings</td></tr><tr><td>Third person limited</td><td>he, she, they</td><td>One character's thoughts</td></tr><tr><td>Third person omniscient</td><td>he, she, they</td><td>Everyone's thoughts</td></tr></table>`,
    `<h4>Why use more than one narrator?</h4><ul><li>To show <b>both sides</b> of a conflict.</li><li>To let the <b>reader know more than the characters</b> (this is called <em>dramatic irony</em>).</li><li>To reveal <b>misunderstandings</b>: what one character believes vs. what's really true.</li><li>To build <b>suspense</b> and <b>empathy</b>.</li></ul>`,
    `<p class="tip">⚠️ <b>Big trap:</b> Each narrator only knows his or her own thoughts. If Elena says “Sam is thrilled,” that's what <em>Elena</em> believes, not necessarily the truth!</p>`
  ],
  move:{name:`The Who-Knows-What Move`, steps:[`<b>Who's talking?</b> (Look for name headings or pronoun changes.)`,`<b>What do they know</b> and believe?`,`<b>What don't they know</b> that the other narrator or the reader knows?`,`<b>What does the shift do?</b> Reveal a secret, build suspense, show a misunderstanding, change our feelings?`]},
  model:{title:`Watch me do it`, passage:[`<b>BELLA (the dog):</b> The boy left the gate open, so I went exploring. I am under the blue porch now, and I am very proud of myself.`, `<b>THEO:</b> I've checked every street twice. Mom says Bella might never come home. It's all my fault for leaving the gate open.`],
    think:[
      {s:`Who`, t:`Two narrators, Bella the dog and Theo, both first person.`},
      {s:`What they know`, t:`Bella knows where she is. Theo doesn't.`},
      {s:`Reader`, t:`I know Bella is safe under the blue porch, but Theo is panicking. I know more than Theo.`},
      {s:`Effect`, t:`The shift creates <b>suspense</b> (will he find her?) and makes me feel <b>sympathy</b> for Theo. It's also a little funny, because Bella is proud while Theo is miserable.`}
    ]},
  guided:[
    {s:`A story switches between Coach Lee's narration and a player named Rosa. Coach Lee thinks Rosa is lazy because she's always late. Rosa's section reveals she walks her little brother to school every morning. What does the shift in narrators do?`, o:[[`It reveals a misunderstanding: the reader learns the truth that Coach Lee doesn't know.`,1],[`It proves Rosa is lazy.`,`NARRATOR_SAME`,`That's only what the coach believes.`],[`It shows that Coach Lee already knows about Rosa's brother.`,`NARRATOR_SAME`,`Does the coach's section show that?`],[`It changes the setting to Rosa's school.`,`TRUE_NOT_TEXT`,`The shift is about what we learn, not a new place.`]], h:`What does the reader know that Coach Lee doesn't?`, w:`The reader sees both sides, so we understand Rosa while the coach misjudges her.`},
    {s:`“I said I was fine. I wasn't.” What does this line from a first-person narrator show?`, o:[[`The narrator hides true feelings from other characters, but the reader knows the truth.`,1],[`Everyone in the story knows the narrator is upset.`,`NARRATOR_SAME`,`Only the reader hears the narrator's thoughts.`],[`The narrator is lying to the reader.`,`TRUE_NOT_TEXT`,`The narrator tells the reader the truth: “I wasn't.”`],[`The story is in third person omniscient.`,`NARRATOR_SAME`,`“I” = first person.`]], h:`Who hears “I wasn't”? The characters or you?`, w:`First person lets us inside the narrator's head, so we know things the other characters don't.`},
    {s:`Why might an author tell a story about a sibling argument through BOTH siblings' points of view?`, o:[[`so the reader understands each sibling's feelings and sees that both have reasons for how they act`,1],[`so the story has fewer characters`,`TRUE_NOT_TEXT`,`It's the same characters.`],[`because both siblings know exactly what the other is thinking`,`NARRATOR_SAME`,`Each narrator only knows his or her own mind.`],[`so the reader knows less than the characters`,`NARRATOR_SAME`,`The reader actually knows MORE.`]], h:`What can the reader see with two narrators that a single narrator can't show?`, w:`Two narrators show both sides, which builds empathy for both.`}
  ],
  check:{title:`Moving Day`, passages:[{title:`Moving Day`, paras:[
    {h:`ELENA`},
    `Everything I own fits into eleven cardboard boxes. I counted them twice while Mom taped the last one shut, and I couldn’t decide whether that number was too big or too small for a whole life. Tomorrow we drive four hundred miles to Jacksonville, where Mom’s new job is, where nobody knows I’m the best goalie on the Fernwood Falcons, where I’ll be the new girl who eats lunch in the library.`,
    `Sam, of course, is thrilled. He’s been running around the empty house all day, shouting to hear his voice echo. Last night he told Mom he can’t wait to see the ocean. He’s eight. He doesn’t understand what we’re leaving.`,
    {h:`SAM`},
    `I yelled in every room today so the house would remember me. That’s not something you can tell your big sister, though, because Elena would say it was dumb. She’s been mad since Mom told us about the move. She slams cabinets. She doesn’t laugh at my jokes anymore, even the good ones.`,
    `I told Mom I can’t wait to see the ocean because Mom’s eyes looked tired and I wanted her to smile. Really, I’m scared of the ocean. I’m scared of the new school and of not having my tree fort. But if I’m scared too, then everybody in this family will be sad at the same time, and somebody has to not be.`,
    {h:`ELENA`},
    `At midnight, I heard a noise from Sam’s room. He was sitting on the floor next to the window with his flashlight, holding the old walkie-talkie from his tree fort. He was crying without making any sound, the way you do when you don’t want anyone to hear.`,
    `I sat down next to him and didn’t say anything for a long time. Then I took the other walkie-talkie out of his box. “Channel 3,” I said. “For emergencies. Even in Jacksonville.”`,
    {h:`SAM`},
    `Elena slept on my floor that night. In the morning, she let me sit in the front seat for the first hour, and when we crossed the bridge, she pointed at the ocean before I even saw it. She didn’t say anything about me being scared. She just pressed the button on her walkie-talkie, and I heard her voice come out of mine: “Copy that. Channel 3.”`
  ]}],
  qs:[
    {s:`How does the shift from Elena's narration to Sam's narration (beginning with paragraph 3) affect the reader's understanding?`, o:[[`It reveals that Sam is actually scared and only pretending to be happy, which Elena doesn't know.`,1],[`It shows that Sam really is thrilled about moving.`,`NARRATOR_SAME`],[`It shows that Elena knows exactly how Sam feels.`,`NARRATOR_SAME`],[`It moves the setting to Jacksonville.`,`TRUE_NOT_TEXT`]], w:`Sam's section reveals the truth Elena can't see. Now the reader knows more than Elena.`},
    {type:`ab`, a:{s:`<b>Part A:</b> What does Elena believe about Sam in paragraph 2?`, o:[[`He is happy and doesn't understand what they are leaving behind.`,1],[`He is secretly scared of the move.`,`NARRATOR_SAME`],[`He is angry at their mom.`,`TRUE_NOT_TEXT`],[`He wants to stay in their old house.`,`NARRATOR_SAME`]], w:`Elena can only see Sam's outside behavior: running, shouting, talking about the ocean.`},
      b:{s:`<b>Part B:</b> Which sentence BEST supports the answer to Part A?`, o:[[`“He’s eight. He doesn’t understand what we’re leaving.”`,1],[`“I yelled in every room today so the house would remember me.”`,`PART_AB`],[`“Really, I’m scared of the ocean.”`,`PART_AB`],[`“Everything I own fits into eleven cardboard boxes.”`,`PART_AB`]], w:`This is Elena's opinion of Sam. Choices B and C come from SAM's narration, so they show what he really feels, not what Elena believes.`}},
    {s:`Why does the author use two narrators instead of one?`, o:[[`to show both siblings' hidden feelings so the reader understands their misunderstanding before they do`,1],[`to tell the story from Mom's point of view`,`TRUE_NOT_TEXT`],[`because both narrators know everything that happens`,`NARRATOR_SAME`],[`to make the story longer`,`TRUE_NOT_TEXT`]], w:`Each sibling hides feelings from the other. Only the reader sees both. That's the power of two narrators.`},
    {s:`In paragraph 5, Elena finds Sam crying. How does this moment in Elena's narration change the story?`, o:[[`Elena discovers Sam's true feelings, which changes how she treats him.`,1],[`Sam stops being scared forever.`,`TRUE_NOT_TEXT`],[`Elena decides the family should not move.`,`TRUE_NOT_TEXT`],[`Elena becomes angry that Sam pretended.`,`TRUE_NOT_TEXT`]], w:`Now Elena finally knows what the reader knew. She responds with kindness (the walkie-talkie), and the siblings reconnect.`},
    {s:`What does Sam's final section (paragraph 8) show the reader?`, o:[[`Elena now looks out for him, and the siblings are connected again.`,1],[`Elena is still angry about the move.`,`NARRATOR_SAME`],[`Sam is no longer scared of anything at all.`,`HALF_RIGHT`],[`The ocean is too dangerous to visit.`,`LITERAL_FIG`]], w:`Elena points out the ocean and answers him on Channel 3. Ending with Sam's voice lets us see Elena's kindness through his eyes.`}
  ]}
});

LESSONS.push({
  id:`r14`, code:`ELA.6.R.1.4`, cat:`pp`, title:`Poetic Forms: Shape Changes Meaning`,
  std:`Describe the impact of various poetic forms on meaning and style.`,
  learn:[
    `<p>A poem's <b>form</b> is its shape and set of rules. Poets choose a form on purpose, because the form changes how the poem <b>sounds</b> (style) and what it <b>means</b>.</p>`,
    `<table class="tbl"><tr><th>Form</th><th>Features</th><th>Usual effect</th></tr>
    <tr><td><b>Free verse</b></td><td>No set rhyme or rhythm; line breaks chosen by the poet</td><td>Sounds like natural speech or private thoughts; line breaks create pauses and emphasis</td></tr>
    <tr><td><b>Haiku</b></td><td>3 lines, 5-7-5 syllables, often nature</td><td>A quiet, focused snapshot of one moment</td></tr>
    <tr><td><b>Limerick</b></td><td>5 lines, AABBA rhyme, bouncy rhythm</td><td>Silly, humorous, playful</td></tr>
    <tr><td><b>Ode</b></td><td>Praises a person, object, or idea; often speaks to it directly (“O...”)</td><td>Celebratory, admiring; can make ordinary things feel important</td></tr>
    <tr><td><b>Ballad</b></td><td>Tells a story in rhyming stanzas, often with a refrain</td><td>Songlike, dramatic storytelling that is easy to remember</td></tr>
    <tr><td><b>Sonnet</b></td><td>14 lines, rhyme scheme, a “turn” (shift) near the end</td><td>Explores a problem or feeling, then shifts or resolves it</td></tr></table>`,
    `<p><b>Words to know:</b> <b>stanza</b> (a group of lines, like a paragraph), <b>line break</b> (where a line ends), <b>rhyme scheme</b> (pattern like AABB), <b>rhythm</b> (the beat), <b>refrain</b> (a repeated line).</p>`
  ],
  move:{name:`Form → Feature → Feeling`, steps:[`Look at the <b>features</b>: number of lines, rhyme, rhythm, who or what is addressed, story or snapshot.`,`Name the <b>form</b>.`,`Ask how the form affects the <b>feeling and meaning</b>. Why did the poet choose THIS form for THIS subject?`]},
  model:{title:`Watch me do it (same topic, two forms)`, passage:[`<b>Haiku:</b><br>Gray clouds lean closer<br>the first raindrop finds my hand<br>the whole street goes still`, `<b>Limerick:</b><br>There once was a girl named Lorraine<br>Who danced every time it would rain.<br>She'd splash and she'd twirl,<br>That rain-loving girl,<br>Till she slid down the street to the drain!`],
    think:[
      {s:`Haiku features`, t:`3 lines, 5-7-5, a nature moment.`},
      {s:`Haiku effect`, t:`Short and quiet, so the rain feels peaceful and important. I slow down and notice one moment.`},
      {s:`Limerick features`, t:`5 lines, AABBA (Lorraine/rain/drain, twirl/girl), bouncy beat.`},
      {s:`Limerick effect`, t:`The bouncy rhythm and silly ending make rain FUNNY. Same topic, totally different meaning and style because of the form.`}
    ]},
  guided:[
    {s:`A poem has 14 lines, a rhyme scheme, and a shift near the end from sadness to hope. What form is it?`, o:[[`sonnet`,1],[`haiku`,`FORM_ONLY`,`A haiku has only 3 lines.`],[`limerick`,`FORM_ONLY`,`A limerick has 5 lines.`],[`free verse`,`FORM_ONLY`,`Free verse doesn't follow a rhyme scheme.`]], h:`Count the lines: 14!`, w:`14 lines + rhyme + a turn = sonnet.`},
    {s:`A poet writes about her grandmother's hands in an <b>ode</b>. What effect does the ode form MOST likely have?`, o:[[`It celebrates and honors the grandmother's hands, showing deep admiration.`,1],[`It makes the grandmother's hands seem silly and funny.`,`FORM_ONLY`,`That's more like a limerick.`],[`It tells a long story with a refrain like a song.`,`FORM_ONLY`,`That's a ballad.`],[`It describes one quick nature moment.`,`FORM_ONLY`,`That's a haiku.`]], h:`What do odes do?`, w:`Odes praise and celebrate. They make the subject feel important and loved.`},
    {s:`In free verse, a poet puts the word “alone” on a line by itself. What is the MOST likely effect?`, o:[[`It makes the reader pause and emphasizes the feeling of loneliness.`,1],[`It makes the poem rhyme.`,`FORM_ONLY`,`One word on a line doesn't create rhyme.`],[`It shows the poet ran out of words.`,`TRUE_NOT_TEXT`,`Poets choose line breaks on purpose.`],[`It turns the poem into a haiku.`,`FORM_ONLY`,`Haiku is a specific 3-line form.`]], h:`What does a line break do to how you read?`, w:`A word alone on a line gets a pause around it, so it stands out, just like the speaker feels alone.`}
  ],
  check:{title:`Two Poems`, passages:[
    {title:`Poem 1 — Ode to My Library Card`, poem:true, paras:[
      `O small blue rectangle, scuffed and bent,<br>you’ve ridden in my pocket everywhere I went—<br>through rainstorms, recess, the bottom of my bag,<br>your corners curling like a tired flag.`,
      `You never asked for money, never asked my name<br>before you let me in; you treat us all the same.<br>With you I’ve climbed the Andes, sailed the Nile at night,<br>and solved a dozen mysteries by flashlight.`,
      `O passport with no country, key without a door,<br>each time I think I’ve read it all, you show me more.<br>So stay with me, small hero, through every year I grow—<br>you’re the reason I can go where I could never go.`
    ]},
    {title:`Poem 2 — Saturday Morning, Laundromat`, poem:true, paras:[
      `The dryers spin<br>and spin<br>like they’re trying to get somewhere.`,
      `My mother folds my brother’s shirts<br>into perfect squares,<br>the way she folds<br>everything—<br>her worries,<br>her long night shifts,<br>her own tired hands—<br>small enough<br>to fit in a basket.`,
      `I sit in the plastic chair<br>reading,<br>and she doesn’t ask me to help.<br>She just says,<br><em>Read me the good part.</em>`
    ]}
  ],
  qs:[
    {s:`Which features show that “Ode to My Library Card” is an ode?`, o:[[`It speaks directly to an object with “O” and praises how important it is.`,1],[`It has three lines with a 5-7-5 syllable pattern.`,`FORM_ONLY`],[`It tells a funny story in five lines.`,`FORM_ONLY`],[`It has no rhyme or regular rhythm.`,`FORM_ONLY`]], w:`“O small blue rectangle” addresses the card directly, and the whole poem praises it. Those are ode features.`},
    {s:`How does the ode form affect the meaning of Poem 1?`, o:[[`By praising an ordinary object in a grand way, the speaker shows how much reading and the library mean to them.`,1],[`It shows that the library card is very expensive.`,`LITERAL_FIG`],[`It makes the poem silly and jokey.`,`FORM_ONLY`],[`It shows that the speaker wants a new card.`,`TRUE_NOT_TEXT`]], w:`Calling a scuffed card a “hero” and a “passport” turns something small into something important. That's the ode's effect.`},
    {type:`ab`, a:{s:`<b>Part A:</b> How does the free-verse form of Poem 2 contribute to its style?`, o:[[`The uneven line breaks slow the reader down and make the poem sound like quiet, personal thoughts.`,1],[`The strict rhyme scheme makes it sound like a song.`,`FORM_ONLY`],[`Its 14 lines and final turn make it a sonnet.`,`FORM_ONLY`],[`Its bouncy rhythm makes it humorous.`,`FORM_ONLY`]], w:`Free verse has no rhyme pattern. Its short, uneven lines feel like someone thinking quietly.`},
      b:{s:`<b>Part B:</b> Which lines BEST show how line breaks create emphasis in Poem 2?`, o:[[`“her worries, / her long night shifts, / her own tired hands—”`,1],[`“I sit in the plastic chair”`,`PART_AB`],[`“My mother folds my brother’s shirts”`,`PART_AB`],[`“and she doesn’t ask me to help.”`,`PART_AB`]], w:`Each heavy thing gets its own line, so the reader pauses on every burden the mother carries.`}},
    {s:`In Poem 2, what does the speaker suggest by saying the mother folds “everything... small enough / to fit in a basket”?`, o:[[`She keeps her worries and tiredness hidden and manageable for her family.`,1],[`She is folding real worries along with the laundry.`,`LITERAL_FIG`],[`She dislikes doing the laundry.`,`TRUE_NOT_TEXT`],[`She owns many laundry baskets.`,`LITERAL_FIG`]], w:`Worries can't really be folded. It's a metaphor: she makes her struggles “small” so the family doesn't carry them.`},
    {s:`How do the forms of the two poems create different effects?`, o:[[`The ode's regular rhyme and “O” address create a celebratory, songlike style, while free verse creates a quieter, conversational style.`,1],[`Both poems use the same rhyme scheme, so they sound alike.`,`FORM_ONLY`],[`The ode is sad and the free verse poem is silly.`,`FORM_ONLY`],[`The ode has no rhythm, while the free verse poem has a strict rhythm.`,`FORM_ONLY`]], w:`Rhyming couplets + praise = celebration. Free verse + line breaks = quiet, personal reflection. Form shapes style.`}
  ]}
});

LESSONS.push({
  id:`r33`, code:`ELA.6.R.3.3`, cat:`gv`, title:`Same Topic, Different Times`,
  std:`Compare and contrast how authors from different time periods address the same or related topics.`,
  learn:[
    `<p>Authors are shaped by <b>when</b> they live. What people <b>knew</b> (science), <b>believed</b> (values), and <b>needed</b> (jobs, land, safety) in 1910 was very different from today. So two authors can write about the same topic and see it completely differently.</p>`,
    `<h4>What to compare</h4><div class="chips"><span>the topic</span><span>each author's view or attitude</span><span>purpose</span><span>word choice and style</span><span>evidence used</span><span>what each knew</span></div>`,
    `<p class="tip">💡 Older texts often use formal, old-fashioned words (“our fair state,” “reclaim this land”). Don't let that scare you. Focus on <b>what the author thinks</b> and <b>why</b>, given their time.</p>`
  ],
  move:{name:`The Time-Machine Venn`, steps:[`Name the shared <b>topic</b>.`,`Write each author's <b>view</b> in one sentence.`,`Ask: What did people <b>know and value</b> in each time period?`,`Compare <b>word choice</b>: positive or negative words about the topic?`,`Find one <b>similarity</b> and one <b>difference</b>.`]},
  model:{title:`Watch me do it`, passage:[`<b>1890s advice book:</b> “A child of ten should rise before the sun to milk the cows and fetch water; idle hands lead to idle minds.”`, `<b>2020s parenting article:</b> “Kids need about 9 to 12 hours of sleep. Chores are great for building responsibility, but sleep and school come first.”`],
    think:[
      {s:`Topic`, t:`Children and work/chores.`},
      {s:`Views`, t:`1890s: kids should work hard early; resting is bad (“idle hands”). 2020s: chores are good, but sleep and school matter more.`},
      {s:`Time period`, t:`In the 1890s many families farmed and needed kids' labor; sleep science didn't exist yet. Today we have research about sleep, and school is the main “job” for kids.`},
      {s:`Similarity + difference`, t:`Both think chores build character. Different: how much kids should work and what comes first.`}
    ]},
  guided:[
    {s:`A 1950s magazine ad says smoking “calms the nerves.” A 2020s health article says smoking causes cancer. What BEST explains the difference?`, o:[[`Scientists had not yet proven the dangers of smoking in the 1950s, but today the evidence is clear.`,1],[`The 1950s author wanted people to get sick.`,`TRUE_NOT_TEXT`,`There's no proof of that. Think about what people KNEW.`],[`Both texts have the same view about smoking.`,`TIME_PERIOD`,`They have opposite views.`],[`The time period doesn't matter here.`,`TIME_PERIOD`,`What changed between the 1950s and now?`]], h:`What did people know then vs. now?`, w:`New scientific knowledge changed how people view smoking.`},
    {s:`Which question helps you compare two texts from different time periods?`, o:[[`What did people in each time period know and value about this topic?`,1],[`Which text is longer?`,`TIME_PERIOD`,`Length doesn't explain the authors' views.`],[`Which text has more paragraphs?`,`TIME_PERIOD`,`That's not a meaningful comparison.`],[`Which text has a title?`,`FEATURE_IGNORE`,`Not useful for comparing views.`]], h:`Think about the TIME part of the standard.`, w:`Knowledge and values change over time, and that explains different views.`},
    {s:`A 1920s writer calls wolves “vicious pests that must be wiped out.” A 2020s writer calls wolves “a keystone species that keeps ecosystems balanced.” How does word choice show the difference?`, o:[[`The 1920s writer uses negative words, while the 2020s writer uses scientific words that show wolves' value.`,1],[`Both writers use negative words about wolves.`,`CONNOTATION`,`Is “keystone species that keeps ecosystems balanced” negative?`],[`The 2020s writer uses the word “pests.”`,`WORD_MATCH`,`Check who said what.`],[`Neither writer has an opinion.`,`TRUE_NOT_TEXT`,`Both clearly do!`]], h:`Compare the feeling of the words each writer chose.`, w:`“Vicious pests” (negative) vs. “keystone species... balanced” (positive, scientific). Word choice reveals each time period's view.`}
  ],
  check:{title:`The Everglades: Then and Now`, passages:[
    {title:`Text 1 — “A Garden Waiting to Be Born” (a newspaper editorial from 1910)`, note:`(Written for practice in the style of the time.)`, paras:[
      `There lies in the southern part of our state a vast and useless wilderness of saw grass and stagnant water, home to nothing but mosquitoes, alligators, and disease. Yet beneath that black water lies soil as rich as any in the world. Once the swamp is drained by a system of canals, these millions of acres will bloom with sugar cane, vegetables, and orange groves.`,
      `Some timid voices warn that we know too little of this country to change it. To them I say: has any great nation grown by leaving its land idle? The engineer’s shovel is the true pioneer of our age. Let us drain the Everglades, reclaim this land for honest farmers, and give Florida the prosperity she deserves.`
    ]},
    {title:`Text 2 — “Bringing Back the River of Grass” (an article from the 2020s)`, paras:[
      `For much of the twentieth century, engineers dug canals and built levees to drain the Everglades for farms and cities. They succeeded, perhaps too well. Today the Everglades is roughly half its original size, and much of the water that once flowed slowly south in a wide, shallow sheet is now sent out to sea through canals.`,
      `Scientists now understand that the Everglades is not a useless swamp but a slow-moving river, often called the “River of Grass.” It filters water, provides habitat for endangered animals such as the Florida panther and the Everglades snail kite, and helps refill the underground aquifer that supplies drinking water to millions of South Floridians.`,
      `Since 2000, state and federal governments have committed billions of dollars to restoration projects that remove barriers, build reservoirs to clean polluted water, and send more water south again. Progress is slow, and the work will take decades. But many Floridians now see the Everglades not as a wasteland to be conquered but as a treasure to be protected.`
    ]}
  ],
  qs:[
    {s:`How does the author of Text 1 view the Everglades?`, o:[[`as useless land that should be drained and turned into farms`,1],[`as a treasure that should be protected`,`TIME_PERIOD`],[`as a river that filters drinking water`,`TIME_PERIOD`],[`as dangerous land that people should avoid forever`,`HALF_RIGHT`]], w:`“Vast and useless wilderness... Let us drain the Everglades.” Choice D is half right: he calls it unpleasant, but he wants to USE it, not avoid it.`},
    {type:`ab`, a:{s:`<b>Part A:</b> How does the time period of Text 1 MOST likely influence the author's view?`, o:[[`In 1910, many people valued growth and farming and saw undeveloped land as wasted.`,1],[`In 1910, scientists had carefully studied how the Everglades supplied water.`,`TIME_PERIOD`],[`In 1910, most people wanted to protect Florida panthers.`,`TIME_PERIOD`],[`The time period had no effect on the author's view.`,`TIME_PERIOD`]], w:`In that era, “progress” meant turning wild land into farms.`},
      b:{s:`<b>Part B:</b> Which sentence BEST supports the answer to Part A?`, o:[[`“To them I say: has any great nation grown by leaving its land idle?”`,1],[`“Scientists now understand that the Everglades is not a useless swamp but a slow-moving river”`,`PART_AB`],[`“Progress is slow, and the work will take decades.”`,`PART_AB`],[`“Some timid voices warn that we know too little of this country to change it.”`,`PART_AB`]], w:`“Leaving its land idle” shows he believes undeveloped land is wasted. Choice D is the view of the people he disagrees with.`}},
    {s:`How does the word choice in the two texts differ?`, o:[[`Text 1 uses words like “useless” and “stagnant” to make the Everglades seem worthless, while Text 2 uses words like “treasure” and “filters” to show its value.`,1],[`Both texts use positive words to praise the Everglades.`,`CONNOTATION`],[`Text 2 calls the Everglades “useless” and “stagnant.”`,`WORD_MATCH`],[`Both texts describe the Everglades as a garden.`,`WORD_MATCH`]], w:`Negative words vs. positive, scientific words. Text 2 even says it is NOT a “useless swamp,” answering Text 1's view.`},
    {s:`Which statement describes a SIMILARITY between the two texts?`, o:[[`Both discuss how changing the Everglades affects Florida's future.`,1],[`Both argue that the Everglades should be drained.`,`TIME_PERIOD`],[`Both describe the Everglades as a “River of Grass.”`,`TIME_PERIOD`],[`Both were written in the same year.`,`TIME_PERIOD`]], w:`Both care about Florida's future (prosperity in Text 1, water and wildlife in Text 2), even though they disagree about what to do.`},
    {s:`How does Text 2 respond to the ideas in Text 1?`, o:[[`It shows that the draining Text 1 called for really happened and caused problems people are now trying to fix.`,1],[`It agrees that draining the Everglades was the best choice.`,`TIME_PERIOD`],[`It says the canals were never built.`,`TRUE_NOT_TEXT`],[`It proves the 1910 author was lying on purpose.`,`TRUE_NOT_TEXT`]], w:`Text 2: engineers “succeeded, perhaps too well,” and now restoration is underway. It shows the results of the 1910 view.`}
  ]}
});

// ===== Mixed practice sets =====
const SETS = [];

SETS.push({id:`mf`, kind:`minifast`, title:`Mini-FAST Dress Rehearsal`, sub:`2 passages · 10 questions · all 3 FAST categories`, check:{passages:[
  {title:`Passage 1 — Closing Time`, paras:[
    `For forty-two years, Dot’s Diner had opened at 5:30 every morning, and for the last eleven of them, Jasmine’s grandfather, Pop, had been the cook. The grill hissed like an angry cat whenever he laid down the bacon, and the <b>regulars</b>, who had ordered the same breakfast every week for years, swore his pancakes could cure a bad day.`,
    `Now the building had been sold. Next month it would become a parking garage.`,
    `On the last morning, Jasmine came in early to help. She expected Pop to be gloomy, but he was humming and flipping pancakes as though it were any ordinary Tuesday.`,
    `“Aren’t you sad?” she finally asked.`,
    `Pop slid a plate across the counter to Mr. Ruiz, who had eaten the same eggs and toast every morning since Jasmine was born. “Sad is for things that are over,” he said. “This isn’t over. Watch.”`,
    `All morning, people came: a nurse in scrubs, two construction workers, a woman who said she’d had her first date in the corner booth. Each one left something on the wall by the register: a photograph, a napkin with a drawing, a note that said simply, <em>Thank you for the Tuesdays.</em> By noon, the wall was a patchwork quilt of memories.`,
    `When the last customer left, Pop took down every photo and note, one at a time, and placed them carefully in a shoebox. He handed the box to Jasmine.`,
    `“A diner isn’t a building,” he said. “It’s the people who keep showing up. Hold on to that.”`,
    `Jasmine held the box against her chest the whole ride home. It was surprisingly heavy.`
  ]},
  {title:`Passage 2 — The Waggle Dance`, paras:[
    {h:`A Dance with a Message`},
    `When a honeybee forager discovers a patch of flowers rich in nectar, she returns to the hive with more than food. She brings information, and she shares it by dancing.`,
    `Inside the dark hive, the forager performs what scientists call the “waggle dance.” She runs in a straight line while waggling her body from side to side, then circles back and repeats the run again and again. Other bees crowd around her, sensing her movements with their antennae.`,
    {h:`Decoding the Dance`},
    `The dance works like a map. The direction of the straight run tells the other bees which way to fly compared with the sun. If the bee runs straight up the honeycomb, the flowers are in the direction of the sun. If she runs at an angle to the left, the flowers are that same angle to the left of the sun. The length of the waggle run shows distance: the longer the waggle, the farther away the food.`,
    `Austrian scientist Karl von Frisch spent decades studying this behavior, and in 1973 he shared a Nobel Prize for his discoveries. Later researchers confirmed his work by tracking bees with tiny radar tags and finding that they flew where the dance had pointed.`,
    {h:`Why It Matters`},
    `Understanding how bees communicate helps beekeepers and farmers. Honeybees pollinate many crops, including Florida’s blueberries and watermelons. When scientists understand how bees find and share food sources, they can plant flowers that keep colonies strong and healthy. A tiny dance, it turns out, helps feed people around the world.`
  ]}
], qs:[
  {s:`<span class="tag">Passage 1</span> In paragraph 1, the author compares the grill to “an angry cat.” What does this simile help the reader understand?`, o:[[`the loud, sharp sizzling sound of the busy grill`,1],[`that a cat lived in the diner's kitchen`,`LITERAL_FIG`],[`that Pop was angry about the diner closing`,`TRUE_NOT_TEXT`],[`that the author uses a simile`,`FIG_NO_TONE`]], w:`Cats hiss when angry. The grill makes a similar sharp sizzle.`},
  {s:`<span class="tag">Passage 1</span> What does the word <b>regulars</b> mean in paragraph 1?`, o:[[`customers who come to the diner often`,1],[`workers who cook at the diner`,`CONTEXT_SKIP`],[`people who follow the rules`,`CONNOTATION`],[`normal-sized pancakes`,`WORD_MATCH`]], w:`The clue “who had ordered the same breakfast every week for years” defines it.`},
  {s:`<span class="tag">Passage 1</span> How does the conversation between Jasmine and Pop in paragraphs 4–5 contribute to the plot?`, o:[[`It shows Jasmine's expectation is wrong and sets up the lesson Pop reveals by the end.`,1],[`It explains why the building was sold.`,`TRUE_NOT_TEXT`],[`Jasmine asks Pop if he's sad.`,`CHAR_SURFACE`],[`It shows that Mr. Ruiz eats eggs and toast.`,`CHAR_SURFACE`]], w:`“This isn't over. Watch.” Pop's answer creates curiosity and leads to the morning of visitors and his final lesson.`},
  {type:`ab`, a:{s:`<span class="tag">Passage 1</span> <b>Part A:</b> Which statement BEST expresses a theme of the story?`, o:[[`A community is made by the people in it, not by the place where they gather.`,1],[`Diners`,`TOPIC_THEME`],[`Jasmine should keep the shoebox forever.`,`PLOT_THEME`],[`Parking garages are bad for cities.`,`TRUE_NOT_TEXT`]], w:`Pop's words and the wall of memories show that people, not buildings, matter.`},
    b:{s:`<b>Part B:</b> Which quotation BEST supports the answer to Part A?`, o:[[`“A diner isn’t a building. It’s the people who keep showing up.”`,1],[`“Next month it would become a parking garage.”`,`PART_AB`],[`“he was humming and flipping pancakes”`,`PART_AB`],[`“The grill hissed like an angry cat”`,`PART_AB`]], w:`Pop says it almost directly.`}},
  {s:`<span class="tag">Passage 1</span> The last line says the box “was surprisingly heavy.” What does this suggest?`, o:[[`The box holds the weight of many people's memories, which now feel important to Jasmine.`,1],[`The shoebox was filled with heavy metal tools.`,`LITERAL_FIG`],[`Jasmine was too weak to carry it.`,`LITERAL_FIG`],[`Pop gave Jasmine too many chores.`,`TRUE_NOT_TEXT`]], w:`Photos and notes aren't really heavy. The “weight” is the meaning they carry.`},
  {s:`<span class="tag">Passage 2</span> Which statement BEST expresses the central idea of “The Waggle Dance”?`, o:[[`Honeybees share directions to food through a dance, and understanding it helps people support bees and crops.`,1],[`Karl von Frisch won a Nobel Prize in 1973.`,`DETAIL_CENTRAL`],[`Insects are interesting animals.`,`TOO_BROAD`],[`Bees should be kept out of farms.`,`TRUE_NOT_TEXT`]], w:`This covers all three sections: the dance, how it works, and why it matters.`},
  {s:`<span class="tag">Passage 2</span> How does the section “Decoding the Dance” contribute to the article?`, o:[[`It explains how the direction and length of the dance tell bees where food is.`,1],[`It says that the bee runs straight up the honeycomb.`,`SECTION_SUMMARY`],[`It tells how farmers grow watermelons.`,`FEATURE_IGNORE`],[`It describes what the inside of a hive looks like.`,`FEATURE_IGNORE`]], w:`Its job: explain HOW the “map” works. Choice B is only one detail from it.`},
  {s:`<span class="tag">Passage 2</span> The prefix <b>de-</b> can mean “undo.” What does <b>decoding</b> mean in the heading “Decoding the Dance”?`, o:[[`figuring out the meaning of a coded message`,1],[`making up a secret code`,`ROOT_MIX`],[`dancing in a straight line`,`CONTEXT_SKIP`],[`hiding information from others`,`ROOT_MIX`]], w:`de (undo) + code: “undoing” a code means figuring out its meaning.`},
  {s:`<span class="tag">Passage 2</span> How does the paragraph about Karl von Frisch and the radar tags develop the article?`, o:[[`It adds evidence from scientists to show the dance really works as a map.`,1],[`It changes the topic to the history of the Nobel Prize.`,`SECTION_SUMMARY`],[`It argues that radar is bad for bees.`,`TRUE_NOT_TEXT`],[`It shows that the dance is only a myth.`,`TRUE_NOT_TEXT`]], w:`Decades of study plus radar tracking = proof that the explanation is true.`},

SETS.push({id:`s1`, kind:`stretch`, title:`Stretch Set 1: Literary`, sub:`Level-4 challenge · theme, POV, figurative language, vocabulary`, check:{passages:[
  {title:`Low Tide`, paras:[
    `The summer my father lost his job, the bay seemed to lose its color too. Or perhaps I simply stopped looking at it. I spent most mornings on the dock behind our rented house, scowling at the mudflats that appeared every day at low tide, gray and shining and smelling faintly of salt and rot.`,
    `My father, who had spent twenty years designing bridges, now spent his mornings at the kitchen table circling job listings in red ink. In the afternoons, he walked the mudflats alone, bent nearly double, his eyes fixed on the ground. I assumed he was hiding from us. I was nearly certain he was hiding from me.`,
    `One afternoon in August, he called my name from the flats and waved me down. I went reluctantly, sinking to my ankles with every step, rehearsing complaints in my head.`,
    `He was crouched beside a shallow pool no bigger than a bathtub. Inside it, the world was <b>teeming</b>: hermit crabs dragging their borrowed shells, a sea star the color of a sunset clinging to a rock, tiny fish flickering like dropped coins.`,
    `“Every six hours,” my father said, “the tide goes out and leaves these pools behind. Everything in here has to survive on what’s left until the water comes back.” He looked at me then, really looked, for the first time all summer. “I’ve been coming out here to remind myself that it always comes back.”`,
    `I didn’t answer. I couldn’t. But I crouched beside him, and we stayed until the water began to slide back over the flats, silver and patient, filling every pool at once.`,
    `He found a job in October, designing a footbridge across a river in Georgia. Before we moved, I walked out to the flats one last time at low tide. The pools were still there, small worlds holding on, waiting.`
  ]}
], qs:[
  {s:`In paragraph 2, the narrator says, “I was nearly certain he was hiding from me.” What does this reveal about the first-person point of view?`, o:[[`The narrator only knows her own feelings, so she misunderstands why her father walks the flats.`,1],[`The narrator knows exactly what her father is thinking.`,`NARRATOR_SAME`],[`The father is truly hiding from his child.`,`TRUE_NOT_TEXT`],[`The story is told by an all-knowing narrator.`,`NARRATOR_SAME`]], w:`Later we learn he was reminding himself that hard times pass. The narrator's guess was wrong because she only sees her side.`},
  {type:`ab`, a:{s:`<b>Part A:</b> Which statement BEST expresses a theme of the story?`, o:[[`Hard times are temporary, and hope can help people hold on until things get better.`,1],[`Tide pools are full of animals.`,`TOPIC_THEME`],[`The father should have found a job sooner.`,`PLOT_THEME`],[`Moving to Georgia is better than living in Florida.`,`TRUE_NOT_TEXT`]], w:`The tide pools hold on until the water returns, just like the family holds on until the job comes.`},
    b:{s:`<b>Part B:</b> Which quotation BEST supports the answer to Part A?`, o:[[`“I’ve been coming out here to remind myself that it always comes back.”`,1],[`“circling job listings in red ink”`,`PART_AB`],[`“sinking to my ankles with every step”`,`PART_AB`],[`“designing a footbridge across a river in Georgia”`,`PART_AB`]], w:`The father connects the tide to his own situation: it always comes back.`}},
  {s:`How does the simile “tiny fish flickering like dropped coins” (paragraph 4) contribute to the tone?`, o:[[`It brings a feeling of wonder and beauty that contrasts with the narrator's earlier gloom.`,1],[`It shows that someone dropped money in the tide pool.`,`LITERAL_FIG`],[`It makes the tone more angry and bitter.`,`FIG_NO_TONE`],[`It shows that the fish were valuable to sell.`,`LITERAL_FIG`]], w:`Earlier the flats were “gray” and smelled of “rot.” Now the fish shine like coins. The tone shifts to wonder.`},
  {s:`What does the word <b>teeming</b> mean in paragraph 4?`, o:[[`full of living things`,1],[`empty and still`,`CONTEXT_SKIP`],[`dirty and smelly`,`CONNOTATION`],[`shallow like a bathtub`,`WORD_MATCH`]], w:`The colon introduces examples: crabs, a sea star, fish. The pool is full of life.`},
  {s:`How does the interaction on the mudflats (paragraphs 5–6) contribute to the plot?`, o:[[`It is a turning point: the father opens up, and the narrator's resentment changes to understanding.`,1],[`It shows that the narrator likes to complain.`,`CHAR_SURFACE`],[`It explains how tides work.`,`DETAIL_CENTRAL`],[`It causes the father to get a job in Georgia.`,`TRUE_NOT_TEXT`]], w:`The narrator came “rehearsing complaints” but ends up crouched beside him, silent. Their relationship changes.`}
]}});

SETS.push({id:`s2`, kind:`stretch`, title:`Stretch Set 2: Informational`, sub:`Level-4 challenge · argument, appeals, roots, text sections`, check:{passages:[
  {title:`Lights Out for Hatchlings`, paras:[
    `Each summer night along Florida’s beaches, a small drama unfolds in the sand. Sea turtle hatchlings, no bigger than a cookie, dig their way out of their nests and scramble toward the sea. For millions of years, they have found the water by crawling toward the brightest horizon: moonlight and starlight reflecting off the waves.`,
    `Today, that ancient instinct can be deadly. Streetlights, porch lights, and glowing condo windows can shine brighter than the ocean horizon, luring hatchlings in the wrong direction. <b>Disoriented</b> turtles may wander onto roads, get trapped in beach plants, or die from exhaustion before morning. Florida wildlife officials record thousands of hatchlings that crawl the wrong way every nesting season.`,
    `Fortunately, this is one of the easiest conservation problems to solve. Many coastal cities now have rules requiring beachfront buildings to use “turtle-friendly” lights: fixtures that are shielded, mounted low, and use amber or red bulbs that turtles are less likely to notice. On beaches where such rules are enforced, the number of lost hatchlings drops sharply.`,
    `Critics argue that dimmer lights could make beaches less safe for people at night. This concern deserves attention, but it is based on a misunderstanding: turtle-friendly lighting is not the same as no lighting. Shielded fixtures aim light downward, where people need it, instead of spilling it across the sand. Some communities have even found that well-designed lighting reduces glare, making it easier for drivers and walkers to see.`,
    `Every beach light left glowing over the dunes is a choice. By choosing to switch off, shield, or replace those lights, Floridians can make sure the next generation of turtles reaches the water, and that an ancient journey continues for millions of years more.`
  ]}
], qs:[
  {s:`What is the author's claim?`, o:[[`Floridians should use turtle-friendly lighting to protect sea turtle hatchlings.`,1],[`Sea turtle hatchlings are about the size of a cookie.`,`CLAIM_EVIDENCE`],[`All lights near beaches must be turned off forever.`,`HALF_RIGHT`],[`Beaches are unsafe for people at night.`,`TRUE_NOT_TEXT`]], w:`The author argues for switching off, shielding, or replacing lights. Choice C goes too far; the author says turtle-friendly is NOT “no lighting.”`},
  {type:`ab`, a:{s:`<b>Part A:</b> How does paragraph 4 develop the argument?`, o:[[`It presents a counterclaim and then rebuts it with an explanation of how shielded lights work.`,1],[`It agrees that turtle-friendly lights make beaches unsafe.`,`HALF_RIGHT`],[`It introduces the problem of disoriented hatchlings.`,`SECTION_SUMMARY`],[`It uses inductive reasoning with many examples.`,`REASONING_TYPE`]], w:`“Critics argue...” is the counterclaim; “but it is based on a misunderstanding...” is the rebuttal.`},
    b:{s:`<b>Part B:</b> Which sentence BEST shows the rebuttal?`, o:[[`“turtle-friendly lighting is not the same as no lighting”`,1],[`“Critics argue that dimmer lights could make beaches less safe for people at night.”`,`PART_AB`],[`“Every beach light left glowing over the dunes is a choice.”`,`PART_AB`],[`“they have found the water by crawling toward the brightest horizon”`,`PART_AB`]], w:`This answers the critics directly.`}},
  {s:`Paragraph 1 describes hatchlings “no bigger than a cookie” that “scramble toward the sea.” Which appeal does this MAINLY use?`, o:[[`pathos`,1],[`logos`,`APPEAL_MIX`],[`ethos`,`APPEAL_MIX`],[`deductive reasoning`,`REASONING_TYPE`]], w:`Tiny, struggling babies make readers care. That's emotion.`},
  {s:`The prefix <b>dis-</b> means “not” or “opposite of,” and <b>orient</b> refers to direction. What does <b>disoriented</b> mean in paragraph 2?`, o:[[`confused about which direction to go`,1],[`facing toward the east`,`ROOT_MIX`],[`tired from a long journey`,`CONTEXT_SKIP`],[`afraid of bright light`,`TRUE_NOT_TEXT`]], w:`dis (not) + orient (direction) = without a sense of direction. The turtles wander the wrong way.`},
  {s:`How does paragraph 3 contribute to the article?`, o:[[`It introduces a solution and gives evidence that it works.`,1],[`It describes how hatchlings dig out of nests.`,`SECTION_SUMMARY`],[`It explains why turtles are attracted to light.`,`HALF_RIGHT`],[`It presents the critics' point of view.`,`SECTION_SUMMARY`]], w:`“Fortunately” signals the turn from problem to solution, with evidence (fewer lost hatchlings).`}
]}});

// ---------- state (autosaved on this device) ----------

// ---------- helpers ----------
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
const isoToday = () => { const d = today(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
function hashStr(s){ let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function order(n, seed){ const a = [...Array(n).keys()]; let x = hashStr(seed) || 1; for (let i = n-1; i > 0; i--) { x ^= x << 13; x ^= x >>> 17; x ^= x << 5; x >>>= 0; const j = x % (i+1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const L = i => `ABCDEFGH`[i];
function misStatus(c){ const r = S.mis[c]; if (!r) return null; if (r.w >= r.m + 2) return `fixed`; if (r.w >= r.m) return `stronger`; return `watch`; }
function watchList(){ return Object.keys(S.mis).filter(c => MIS[c]).sort((a,b) => (S.mis[b].m - S.mis[b].w) - (S.mis[a].m - S.mis[a].w) || S.mis[b].m - S.mis[a].m); }
function logMiss(c, where){ if (!MIS[c]) return; const r = S.mis[c] || (S.mis[c] = {m:0, w:0, where:``, last:``}); r.m++; r.where = where; r.last = isoToday(); }
function logWins(q){ const codes = new Set(q.o.filter(o => o[1] !== 1).map(o => o[1])); codes.forEach(c => { if (S.mis[c]) S.mis[c].w++; }); }
function lessonDone(id){ return S.chk[id] && S.chk[id].att && S.chk[id].att.length > 0; }
function best(id){ const c = S.chk[id]; if (!c || !c.att || !c.att.length) return null; return c.att.reduce((b,a) => a.p > b.p ? a : b); }
function pct(a){ return Math.round(100 * a.s / a.t); }

// ---------- read-aloud (prefers the Google US English voice) ----------
let voice = null;
function pickVoice(){ const vs = speechSynthesis.getVoices(); voice = vs.find(v => v.name === `Google US English`) || vs.find(v => /samantha/i.test(v.name) && v.lang === `en-US`) || vs.find(v => v.lang === `en-US`) || vs.find(v => /^en/.test(v.lang)) || null; }
if (`speechSynthesis` in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function textOf(el){ const c = el.cloneNode(true); c.querySelectorAll(`.pn,.noread,button,.code,.readsrc`).forEach(x => x.remove()); c.querySelectorAll(`h3,h4,th,summary`).forEach(x => x.append(`. `)); c.querySelectorAll(`p,li,td,div,br`).forEach(x => x.after(` `)); c.querySelectorAll(`.opt-l`).forEach(x => x.textContent = x.textContent + `. `); return c.innerText.replace(/\s+/g, ` `).replace(/ELA\.\S+/g, ``).trim(); }
function speak(el){ if (!(`speechSynthesis` in window)) return; speechSynthesis.cancel(); const t = textOf(el); const chunks = t.match(/[^.!?]+[.!?”"]*\s*/g) || [t]; chunks.forEach(ch => { const u = new SpeechSynthesisUtterance(ch); if (voice) u.voice = voice; u.lang = `en-US`; u.rate = 0.95; speechSynthesis.speak(u); }); document.body.classList.add(`speaking`); const end = setInterval(() => { if (!speechSynthesis.speaking) { document.body.classList.remove(`speaking`); clearInterval(end); } }, 400); }
function stopSpeak(){ if (`speechSynthesis` in window) speechSynthesis.cancel(); if (window.PLAYER) { PLAYER.pause(); } document.querySelectorAll(`[data-audio].playing`).forEach(b => { b.classList.remove(`playing`); b.textContent = `🔊 Read to me`; }); document.body.classList.remove(`speaking`); }
let PLAYER = null;
document.addEventListener(`click`, e => {
  const b = e.target.closest(`[data-audio]`); if (!b) return;
  if (b.classList.contains(`playing`)) { stopSpeak(); return; }
  stopSpeak();
  PLAYER = PLAYER || new Audio(); window.PLAYER = PLAYER;
  PLAYER.src = b.dataset.audio; PLAYER.playbackRate = 1;
  const fail = () => { b.classList.remove(`playing`); b.textContent = `🔊 Read to me`; const t = document.getElementById(b.dataset.fallback); if (t) speak(t); };
  PLAYER.onended = () => { b.classList.remove(`playing`); b.textContent = `🔊 Read to me`; document.body.classList.remove(`speaking`); };
  PLAYER.onerror = fail;
  b.classList.add(`playing`); b.textContent = `⏸ Stop reading`; document.body.classList.add(`speaking`);
  const pr = PLAYER.play(); if (pr && pr.catch) pr.catch(err => { if (err && err.name !== `AbortError`) fail(); });
});
document.addEventListener(`click`, e => { const b = e.target.closest(`[data-read]`); if (b) { const t = document.getElementById(b.dataset.read); if (t) speak(t); } });

// ---------- confetti ----------
function confetti(){
  if (matchMedia(`(prefers-reduced-motion: reduce)`).matches) return;
  const cv = document.createElement(`canvas`); cv.className = `confetti`; document.body.appendChild(cv);
  const ctx = cv.getContext(`2d`); const W = cv.width = innerWidth, H = cv.height = innerHeight;
  const cols = [`#7c5cff`,`#13a3a6`,`#ff7a59`,`#ffc83d`,`#3dbd6a`,`#ff5fa2`];
  const P = Array.from({length: 180}, () => ({x: W/2 + (Math.random()-.5)*W*.3, y: H*.35, vx: (Math.random()-.5)*14, vy: -Math.random()*14-4, r: Math.random()*6+4, c: cols[Math.random()*cols.length|0], a: Math.random()*6, s: (Math.random()-.5)*.3}));
  let f = 0; (function tick(){ ctx.clearRect(0,0,W,H); P.forEach(p => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.s; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); ctx.restore(); }); if (++f < 170) requestAnimationFrame(tick); else cv.remove(); })();
}

    if (x.h) return `<h4 class="ph">${x.h}</h4>`;
    if (x.fig) return `<figure class="fig">${x.fig}</figure>`;
    if (x.side) return `<aside class="side">${x.side}</aside>`;
    return ``;
  }).join(``);
  return `<article class="passage" id="${pid}"><div class="ptop"><h3>${p.title}</h3><button class="read" data-audio="audio/${pid}.mp3" data-fallback="${pid}" type="button">🔊 Read to me</button></div>${p.note ? `<p class="note noread">${p.note}</p>` : ``}<div class="${p.poem ? `poem` : `prose`}">${body}</div></article>`;
}

// ---------- question rendering ----------
function reminderFor(q){
  const codes = [...new Set(q.o.filter(o => o[1] !== 1).map(o => o[1]))].filter(c => misStatus(c) === `watch`);
