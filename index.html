  const s = ALL[id]; S.last = `#set-${id}`;
  return `<div class="lhead"><span class="chip c-mix">${s.kind === `minifast` ? `All 3 FAST categories` : `Stretch`}</span><h1>${s.title}</h1><p class="lead">${s.sub}</p></div>
  <div class="card intro"><p>${s.kind === `minifast` ? `This is a dress rehearsal for the FAST. Do it in one sitting (about 30 minutes) in a quiet spot. Read each passage carefully, use your Moves, and check every answer before you submit. No help from your tutor until you're done!` : `These questions are a little harder, on purpose. They're the kind of thinking a Level 4 reader does. Take your time and use your Moves.`}</p></div>${checkHTML(id, s.check)}`;
}

function viewFix(){
  S.last = `#fix`;
  let codes = watchList().filter(c => misStatus(c) !== `fixed`).slice(0, 8);
  const empty = !codes.length;
  if (empty) codes = Object.keys(REVIEW).sort((a, b) => hashStr(a + S.fixRound) - hashStr(b + S.fixRound)).slice(0, 5);
  codes.forEach(c => register(REVIEW[c], `fx${S.fixRound}-${c}`));
  return `<div class="lhead"><span class="chip c-fix">About 15 minutes</span><h1>Fix-It Review</h1><p class="lead">${empty ? `You don't have any watch-outs right now, so here is a mixed review of common FAST traps.` : `These questions target the traps on <b>your</b> watch-out list. Every time you avoid a trap, it gets weaker. Avoid it two more times than you fell for it and it's <b>Fixed!</b>`}</p></div>
  <div class="qlist">${codes.map((c, i) => `<div class="fixlabel noread">Trap: ${MIS[c].name}</div>` + oneQ(REVIEW[c], `fx${S.fixRound}-${c}`, `review`, i+1, false)).join(``)}</div>
  <div class="card center"><p class="noread">Finished? Show your tutor which traps you beat today.</p><button class="btn" type="button" id="newRound">Start a fresh round</button> <a class="btn ghost" href="#progress">See my watch-out list</a></div>`;
}
document.addEventListener(`click`, e => { if (e.target.id === `newRound`) { S.fixRound++; save(); route(); scrollTo({top:0}); } });

function viewProgress(){
  const rows = cat => LESSONS.filter(l => l.cat === cat).map(l => { const b = best(l.id); const c = S.chk[l.id]; return `<tr><td><a href="#l-${l.id}">${l.title}</a></td><td class="num">${b ? `${b.s}/${b.t}` : `–`}</td><td class="num">${b ? `<span class="pc ${b.p >= 80 ? `g` : b.p >= 60 ? `y` : `r`}">${b.p}%</span>` : `–`}</td><td class="num">${c && c.att ? c.att.length : 0}</td></tr>`; }).join(``);
  const catAvg = cat => { const bs = LESSONS.filter(l => l.cat === cat).map(l => best(l.id)).filter(Boolean); return bs.length ? Math.round(bs.reduce((a, b) => a + b.p, 0) / bs.length) : null; };
  const wl = watchList();
  const sets = SETS.map(s => { const b = best(s.id); return `<tr><td><a href="#set-${s.id}">${s.title}</a></td><td class="num">${b ? `${b.s}/${b.t}` : `–`}</td><td class="num">${b ? `${b.p}%` : `–`}</td><td class="num">${S.chk[s.id] && S.chk[s.id].att ? S.chk[s.id].att.length : 0}</td></tr>`; }).join(``);
  return `<div class="lhead"><h1>${S.name ? NM() + `'s` : `My`} Progress</h1><p class="lead">Best scores on each skill check, plus every trap you're working to fix. Tutors: a screenshot of this page makes a quick progress report.</p></div>
  <div class="grid3 cats">${Object.keys(CATS).map(k => { const a = catAvg(k); return `<div class="tile c-${k}b"><div class="tlab">${CATS[k].name}</div><div class="tnum">${a == null ? `–` : a + `%`}</div></div>`; }).join(``)}</div>
  ${Object.keys(CATS).map(k => `<section class="card"><h3>${chip(k)} ${CATS[k].name}</h3><div class="tblwrap"><table class="tbl prog"><tr><th>Skill</th><th>Best</th><th>%</th><th>Tries</th></tr>${rows(k)}</table></div></section>`).join(``)}
  <section class="card"><h3>Practice sets</h3><div class="tblwrap"><table class="tbl prog"><tr><th>Set</th><th>Best</th><th>%</th><th>Tries</th></tr>${sets}</table></div></section>
  <section class="card"><h3>🔑 Watch-out list (misconceptions)</h3>${wl.length ? `<div class="tblwrap"><table class="tbl prog"><tr><th>Trap</th><th>Fell for it</th><th>Avoided it</th><th>Status</th><th>Last seen in</th></tr>${wl.map(c => { const r = S.mis[c]; const st = misStatus(c); return `<tr><td><b>${MIS[c].name}</b><br><small>${MIS[c].fix}</small></td><td class="num">${r.m}</td><td class="num">${r.w}</td><td><span class="st ${st}">${st === `watch` ? `Watch` : st === `stronger` ? `Getting stronger` : `Fixed!`}</span></td><td><small>${esc(r.where || ``)}</small></td></tr>`; }).join(``)}</table></div><p class="small">How it works: every wrong answer is tagged with the trap behind it. When the student later avoids that trap, it counts as “avoided.” When avoided ≥ fell for it, the status becomes “Getting stronger.” Two more avoids than misses = “Fixed!”</p>` : `<p>No traps logged yet. As you answer questions, any misconceptions will show up here automatically, and her Warm-Ups and Fix-It Reviews will target them.</p>`}
  <a class="btn" href="#fix">Practice my watch-outs</a></section>`;
}

function viewTutor(){
  return `<div class="lhead"><h1>Tutor's Guide</h1><p class="lead">How to run Time to Climb with any 6th grader: the session routine, how to coach, what the scores mean, and what to do after the 13 stops. The full answer key is in the separate Time to Climb Tutor Guide document.</p></div>
  <section class="card"><h2>What this is</h2>
  <p>Time to Climb teaches the 13 Grade 6 reading skills tested on Florida's FAST, grouped by the test's three reporting categories: <b>Reading Across Genres &amp; Vocabulary</b>, <b>Reading Informational Text</b>, and <b>Reading Prose &amp; Poetry</b>. Each stop is one skill, taught in six steps, with an original grade-level passage written in the FAST style.</p>
  <p>Every wrong answer is tagged with the misconception behind it. Those traps become the student's watch-out list, and the Warm-Ups, Fix-It Reviews, and in-question reminders keep re-teaching them until they are fixed.</p></section>

  <section class="card"><h2>The session routine (about 45 minutes)</h2>
  <div class="tblwrap"><table class="tbl"><tr><th>Step</th><th>Minutes</th><th>What the student does</th><th>What the tutor does</th></tr>
  <tr><td>1. Warm-Up</td><td class="num">5</td><td>Reads their watch-outs and answers 2 review questions</td><td>Let them try first.</td></tr>
  <tr><td>2. Learn It</td><td class="num">8</td><td>Reads (or listens with 🔊) the lesson and the Move</td><td>Ask: “Tell me the Move in your own words.”</td></tr>
  <tr><td>3. See It</td><td class="num">5</td><td>Watches a model, one thinking step at a time</td><td>Read it together; pause on each step.</td></tr>
  <tr><td>4. Try It</td><td class="num">10</td><td>3 guided questions with hints and feedback</td><td>Coach here. Use the hint before giving any answer.</td></tr>
  <tr><td>5. Show What You Know</td><td class="num">15</td><td>FAST-style passage and 5–6 questions, one try</td><td>No help with answers. Reading the passage aloud is fine.</td></tr>
  <tr><td>6. Show Your Tutor</td><td class="num">3</td><td>Shows the score and what they learned</td><td>Celebrate, ask 2 questions, check “I checked this work.”</td></tr></table></div>
  <p><b>Short on time or stamina?</b> Split it: Steps 1–4 in one sitting (about 28 minutes), Steps 5–6 in the next (about 18 minutes).</p></section>

  <section class="card"><h2>How to coach when they're stuck</h2>
  <ol class="find"><li><b>Read it with them.</b> Tap 🔊 or read aloud. Many “stuck” moments are reading-stamina moments.</li><li><b>Ask for the Move.</b> “What's today's Move? What's step 1?”</li><li><b>Give the hint</b> (Try It questions have one behind 💡).</li><li><b>Point, don't tell.</b> Send them to the paragraph or clue word that matters.</li><li><b>Tell, then explain.</b> If still stuck, give the answer, read the “why” together, and have them explain it back.</li></ol></section>

  <section class="card"><h2>What the scores mean</h2>
  <ul><li><b>80% or higher</b> (4/5, 5/5, 5/6, 6/6): move on to the next stop.</li><li><b>60–79%</b> (3/5, 4/6): next session, redo Try It (10 min) and start a new attempt on the check before moving on.</li><li><b>Below 60%:</b> reread Learn It together, redo Try It, retake the check, and add extra Fix-It Reviews for that skill.</li></ul>
  <p>The <b>My Progress</b> page shows the best score on every skill, an average for each FAST category, and the student's watch-out list. A screenshot of it makes a quick progress report for a teacher or parent.</p>
  <h3>FAST levels for 6th grade reading</h3>
  <div class="tblwrap"><table class="tbl"><tr><th>Level</th><th>Scale score</th><th>Meaning</th></tr><tr><td>1</td><td class="num">161–208</td><td>Well below grade level</td></tr><tr><td>2</td><td class="num">209–224</td><td>Below grade level</td></tr><tr><td>3</td><td class="num">225–236</td><td>On grade level</td></tr><tr><td>4</td><td class="num">237–249</td><td>Above grade level</td></tr><tr><td>5</td><td class="num">250–284</td><td>Well above grade level</td></tr></table></div>
  <p class="small">Source: Florida Department of Education, 2026–27 FAST Fact Sheet. If you have the student's FAST report, check their result in each of the three categories and start with the weakest one.</p></section>

  <section class="card"><h2>The 13 stops</h2><div class="tblwrap"><table class="tbl"><tr><th>Stop</th><th>Skill</th><th>FAST category</th></tr>${PLAN.filter(p => ALL[p.id] || p.id === `fix`).map(p => `<tr><td>${p.lab}</td><td>${ALL[p.id] ? ALL[p.id].title : `Fix-It Review (15 min${p.opt ? `, optional` : ``})`}</td><td>${ALL[p.id] && ALL[p.id].cat ? CATS[ALL[p.id].cat].short : ALL[p.id] ? `All 3` : ``}</td></tr>`).join(``)}</table></div></section>

  <section class="card"><h2>Test-day tips</h2><ul>
  <li>Good sleep the night before and a real breakfast.</li>
  <li>Skim the title and questions, then read the passage carefully. Paragraph numbers tell you where to look.</li>
  <li>Use the Moves: Detective (words), Umbrella (central idea), N-E-T (figurative language), Because-So (characters), Who-Knows-What (narrators).</li>
  <li><b>Two-part questions:</b> answer Part A first, then pick the Part B quote that proves it.</li>
  <li><b>“Choose two” questions:</b> pick exactly two.</li>
  <li>Cross out answers that are only half right or not in the text. It's not a race.</li></ul></section>

  <section class="card"><h2>Part 2 · After the 13 stops: the weekly routine</h2>
  <div class="tblwrap"><table class="tbl"><tr><th>Session</th><th>Minutes</th><th>What to do</th></tr>
  <tr><td>Session 1</td><td class="num">30</td><td>Fix-It Review (15) + 15 minutes of a nonfiction article or book. After each section, the student says the main point in their own words.</td></tr>
  <tr><td>Session 2</td><td class="num">30</td><td>Redo one stop where the best score is under 80% (Learn It, Try It, new attempt on the check). If all are 80%+, redo stops from the weakest category.</td></tr>
  <tr><td>Session 3</td><td class="num">30</td><td>A Stretch Set, then rotate: retake one check per week, oldest first.</td></tr>
  <tr><td>Every day</td><td class="num">20</td><td>Reading for fun. Ask one question: “What's the theme so far?” “Who's telling the story?” “What does the author want you to believe?”</td></tr>
  <tr><td>Once a month</td><td class="num">30</td><td>Retake the Mini-FAST (new attempt) to measure growth.</td></tr></table></div>
  <p class="small">All work saves automatically on the student's device and browser. Use the same device each session.</p></section>`;
}

document.addEventListener(`submit`, e => { if (e.target.id === `nameForm`) { e.preventDefault(); const v = $(`#nameIn`).value.trim(); if (v) { S.name = v; save(); route(); } } });
// ---------- router ----------
function route(){
  stopSpeak(); QINDEX = {};
  const h = location.hash.slice(1) || `home`;
  let html = ``;
  if (h.startsWith(`l-`) && ALL[h.slice(2)]) html = viewLesson(h.slice(2));
  else if (h.startsWith(`set-`) && ALL[h.slice(4)]) html = viewSet(h.slice(4));
  else if (h === `fix`) html = viewFix();
  else if (h === `progress`) html = viewProgress();
  else if (h === `tutor`) html = viewTutor();
  else html = viewHome();
  app().innerHTML = html; fillReadSrc(app()); updateSubmit && CUR && $(`#submitBtn`) && updateSubmit();
  document.querySelectorAll(`.topnav a`).forEach(a => a.classList.toggle(`on`, a.getAttribute(`href`) === `#` + (h.startsWith(`l-`) || h.startsWith(`set-`) || h === `fix` ? `home` : h)));
  if (h !== `home` && h !== `tutor` && h !== `progress`) save();
  const cont = $(`#continue`); if (cont) { cont.hidden = !(h === `home` && S.last && S.last !== `#home`); cont.href = S.last || `#home`; }
}
addEventListener(`hashchange`, () => { route(); scrollTo({top:0}); });
route();

</script>

</body></html>
