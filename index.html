LESSONS.push({
  id:`r22`, code:`ELA.6.R.2.2`, cat:`it`, title:`Central Idea: The Umbrella`,
  std:`Analyze the central idea(s), stated or implied, and how it is developed throughout a text.`,
  learn:[
    `<p>The <b>central idea</b> is the main point the author develops across the <b>whole</b> text. Think of it as an umbrella: every paragraph should fit underneath it.</p>`,
    `<table class="tbl"><tr><th>Not the central idea</th><th>Why</th></tr>
     <tr><td>“Lawns.”</td><td>That's only a <b>topic</b> (1–3 words).</td></tr>
     <tr><td>“Fertilizer causes algae.”</td><td>That's only one <b>detail</b>; it's too small.</td></tr>
     <tr><td>“Nature is important.”</td><td>Too <b>broad</b>; it could fit 1,000 articles.</td></tr>
     <tr><td colspan="2" class="good">✔ “Traditional lawns have hidden costs for Florida's water and wildlife, so people should consider better options.” This covers the whole article, and it's specific.</td></tr></table>`,
    `<h4>“Development” means HOW it grows</h4><p>FAST also asks how a paragraph <b>develops</b> the central idea. Each paragraph has a job: it <b>introduces</b> the problem, <b>adds</b> another reason, <b>gives an example</b>, <b>explains a cause</b>, <b>offers a solution</b>, or <b>sums up</b>.</p>`,
    `<p class="tip">💡 <b>Paraphrase power:</b> After each paragraph, say its point to yourself in 5–8 words, in your own words. Those mini-summaries add up to the central idea. (This is also how you check that you understood what you read!)</p>`
  ],
  move:{name:`The Umbrella Move`, steps:[`Name the <b>topic</b> in 1–3 words.`,`Ask: What does the author keep <b>saying about</b> the topic? Check the title, the first paragraph, and the last paragraph.`,`Put it in one <b>sentence</b> in your head.`,`<b>Umbrella test:</b> Does every paragraph fit under it? If one doesn't, your idea is too small.`,`For “development” questions, name each paragraph's <b>job</b>.`]},
  model:{title:`Watch me do it`, passage:[`<b>Why Teens Need More Sleep</b>`, `(1) Many teenagers stay up late scrolling, studying, or gaming, then drag themselves out of bed for school. (2) Scientists say the teenage brain shifts its sleep clock later during puberty, so falling asleep early really is harder. (3) Without 8 to 10 hours of sleep, teens have more trouble focusing, remembering, and controlling their moods. (4) Simple habits, like putting phones away an hour before bed, can help teens get the rest their growing brains need.`],
    think:[
      {s:`Topic`, t:`Teens and sleep.`},
      {s:`What's said about it`, t:`Title: teens need MORE sleep. Last sentence: habits can help them get it.`},
      {s:`My sentence`, t:`<em>Teens need more sleep for their brains, and simple habits can help them get it.</em>`},
      {s:`Umbrella test`, t:`(1) the problem: staying up late ✔ (2) cause: the brain's clock shifts ✔ (3) effect: trouble focusing ✔ (4) solution: habits ✔. Everything fits!`},
      {s:`Development`, t:`Problem → cause → effect → solution. If FAST asked “How does sentence 2 develop the central idea?” I'd say: it <b>explains a cause</b> of why teens don't get enough sleep.`}
    ]},
  guided:[
    {s:`<em>School gardens give students a place to learn science outside. Students measure plant growth, test soil, and track weather. Many also say that working in a garden lowers their stress and helps them make friends.</em><br><br>What is the central idea of this paragraph?`, o:[[`School gardens help students learn and feel better.`,1],[`Students test soil in gardens.`,`DETAIL_CENTRAL`,`That is just one detail. Does it cover the stress and friendship part?`],[`Gardens are places where plants grow.`,`TOO_BROAD`,`That's true about every garden. What is the text's specific point?`],[`Every school must build a garden next year.`,`TRUE_NOT_TEXT`,`The text never says that.`]], h:`Use the umbrella test. Does your answer cover BOTH learning and feelings?`, w:`It covers both halves: learning science AND lowering stress and making friends.`},
    {s:`Using the same paragraph, which detail BEST supports the central idea that school gardens help students learn?`, o:[[`“Students measure plant growth, test soil, and track weather.”`,1],[`“School gardens”`,`DETAIL_CENTRAL`,`That's just the topic.`],[`“helps them make friends”`,`HALF_RIGHT`,`That supports feeling better, not learning.`],[`“outside”`,`WORD_MATCH`,`One word can't support an idea.`]], h:`Which detail shows students LEARNING?`, w:`Measuring, testing, and tracking are science learning activities.`},
    {s:`An article about recycling has four paragraphs: (1) how much trash Americans make, (2) how recycling works, (3) a town that cut its trash in half, (4) tips for kids to recycle more. How does paragraph 3 develop the central idea?`, o:[[`It gives a real-life example showing recycling can make a big difference.`,1],[`It says a town cut its trash in half.`,`SECTION_SUMMARY`,`That tells WHAT it says. Questions about development want its JOB.`],[`It introduces the problem of trash.`,`HALF_RIGHT`,`That's paragraph 1's job.`],[`It explains how recycling machines work.`,`TRUE_NOT_TEXT`,`That's paragraph 2.`]], h:`What is the JOB of a story about a real town?`, w:`A real town's success is an <b>example</b> that proves recycling works.`}
  ],
  check:{title:`The Problem with Perfect Lawns`, passages:[{title:`The Problem with Perfect Lawns`, paras:[
    `Drive through almost any neighborhood in Florida and you will see the same thing: wide, flat rectangles of bright green grass, trimmed short and perfectly even. For decades, a perfect lawn has been a symbol of a well-kept home. But scientists and water managers are asking a difficult question: what does that perfect lawn actually cost?`,
    `The first cost is water. In many Florida homes, as much as half of the water a household uses goes to watering the yard rather than to drinking, cooking, or bathing. Much of that water comes from the Floridan Aquifer, an underground layer of rock that holds the fresh water millions of people depend on. When people pump water out faster than rain can refill the aquifer, springs can weaken, and salt water can creep into wells near the coast.`,
    `The second cost is pollution. To keep grass green, many homeowners spread fertilizer several times a year. When heavy rain falls, some of that fertilizer washes into storm drains and then into rivers, lakes, and bays. The extra nutrients feed algae, which can grow into thick blooms that block sunlight, use up oxygen, and harm fish and other wildlife.`,
    `The third cost is less obvious: habitat. A lawn made of a single type of grass offers little food or shelter for bees, butterflies, and birds. Native plants, on the other hand, developed alongside Florida’s wildlife over thousands of years. A yard with native wildflowers and shrubs can become a resting stop for monarch butterflies or a feeding ground for hummingbirds.`,
    `None of this means that every lawn must disappear. Grass is still useful for playing, and some neighborhoods have rules about how yards must look. Instead, many experts recommend a middle path known as “Florida-friendly” landscaping: keeping a smaller patch of grass, replacing the rest with native plants that need little water once they are established, and using fertilizer only when and where it is truly needed.`,
    `A perfect lawn may look tidy from the street, but its true price is paid underground, in the water, and in the sky. By rethinking what a beautiful yard looks like, Floridians can protect the resources that make their state worth living in.`
  ]}],
  qs:[
    {type:`ab`, a:{s:`<b>Part A:</b> Which statement BEST expresses the central idea of the article?`, o:[[`Traditional lawns have hidden costs to Florida's water and wildlife, so people should consider Florida-friendly yards.`,1],[`Fertilizer can cause algae blooms in Florida's lakes and rivers.`,`DETAIL_CENTRAL`],[`Florida has many beautiful neighborhoods.`,`TOO_BROAD`],[`Every lawn in Florida should be removed right away.`,`TRUE_NOT_TEXT`]], w:`This covers all the costs (water, pollution, habitat) AND the solution.`},
      b:{s:`<b>Part B:</b> Which sentence from the article BEST supports the answer to Part A?`, o:[[`“A perfect lawn may look tidy from the street, but its true price is paid underground, in the water, and in the sky.”`,1],[`“Grass is still useful for playing, and some neighborhoods have rules about how yards must look.”`,`PART_AB`],[`“The extra nutrients feed algae.”`,`DETAIL_CENTRAL`],[`“Drive through almost any neighborhood in Florida and you will see the same thing.”`,`PART_AB`]], w:`The conclusion sums up all three costs in one sentence: underground (water), in the water (pollution), in the sky (birds and butterflies).`}},
    {s:`How does paragraph 4 develop the central idea?`, o:[[`It adds a third cost, the loss of habitat for wildlife, to the problems with lawns.`,1],[`It explains how hummingbirds build their nests.`,`DETAIL_CENTRAL`],[`It shows that lawns are excellent homes for wildlife.`,`TRUE_NOT_TEXT`],[`It says that butterflies stop in yards.`,`SECTION_SUMMARY`]], w:`“The third cost” is the signal: this paragraph adds another reason to the central idea.`},
    {s:`Why does the author include paragraph 5?`, o:[[`to offer a balanced solution so readers know they don't have to get rid of all grass`,1],[`to argue that lawns are not a problem after all`,`TRUE_NOT_TEXT`],[`to describe neighborhood rules in detail`,`DETAIL_CENTRAL`],[`to repeat the problem of fertilizer`,`WORD_MATCH`]], w:`“None of this means that every lawn must disappear... a middle path.” Its job is to give a reasonable solution.`},
    {type:`multi`, n:2, s:`Select <b>TWO</b> details that support the idea that lawns can harm Florida's water.`, o:[[`“When people pump water out faster than rain can refill the aquifer, springs can weaken”`,1],[`“some of that fertilizer washes into storm drains and then into rivers, lakes, and bays”`,1],[`“a perfect lawn has been a symbol of a well-kept home”`,`DETAIL_CENTRAL`],[`“a resting stop for monarch butterflies”`,`DETAIL_CENTRAL`],[`“Grass is still useful for playing”`,`TRUE_NOT_TEXT`]], w:`One shows harm to underground water, and one shows pollution in rivers and lakes.`},
    {s:`Which is the BEST paraphrase of paragraph 2?`, o:[[`Watering lawns uses a lot of underground fresh water, which can hurt springs and wells.`,1],[`Floridians use too much water for drinking and cooking.`,`HALF_RIGHT`],[`The Floridan Aquifer is made of rock.`,`DETAIL_CENTRAL`],[`Salt water is better for lawns than fresh water.`,`TRUE_NOT_TEXT`]], w:`A good paraphrase keeps the main point in your own words: watering lawns drains the aquifer and hurts springs and wells.`}
  ]}
});

LESSONS.push({
  id:`r21`, code:`ELA.6.R.2.1`, cat:`it`, title:`Text Sections & Features: What's Its Job?`,
  std:`Explain how individual text sections and/or text features convey meaning in a text.`,
  learn:[
    `<p>Every part of an informational text is there for a reason. <b>Text features</b> (headings, captions, diagrams, sidebars, bold words, maps, charts, timelines) and <b>sections</b> (introduction, body sections, conclusion, even one paragraph) each have a <b>job</b>.</p>`,
    `<h4>Job verbs (use these to think!)</h4><div class="chips"><span>introduces</span><span>gives background</span><span>explains how</span><span>shows a cause/effect</span><span>gives an example</span><span>compares</span><span>shows visually</span><span>defines</span><span>adds detail</span><span>emphasizes</span><span>concludes</span></div>`,
    `<p>FAST questions sound like: “How does the section ‘___’ contribute to the article?” or “Why does the author include the diagram?” The right answer explains the <b>job</b> AND connects it to the big idea. A wrong answer often just <b>retells</b> what the section says.</p>`,
    `<table class="tbl"><tr><th>Question</th><th>❌ Retelling</th><th>✔ Job</th></tr><tr><td>Why include the caption?</td><td>It says the eyewall has strong winds.</td><td>It <b>explains</b> the diagram so readers understand <b>why</b> the eyewall is most dangerous.</td></tr></table>`
  ],
  move:{name:`The “Why Is It HERE?” Move`, steps:[`Read the section or feature the question names. Make sure you're looking at the RIGHT one.`,`Say WHAT it says in 5 words.`,`Look at what comes before and after it.`,`Name its JOB with a job verb.`,`Choose the answer that gives the job + connects to the main idea.`]},
  model:{title:`Watch me do it`, passage:[`<b>How Sea Turtles Find Their Way</b>`, `<b>A Built-In Compass</b> — Loggerhead turtles can sense Earth's magnetic field. Each part of the coast has its own magnetic “signature,” which helps a turtle return to the beach where it hatched.`, `<b>Sidebar: Lights Out!</b> Hatchlings head toward the brightest horizon. Beach lights can confuse them, so many Florida towns ask residents to turn off outdoor lights during nesting season.`],
    think:[
      {s:`Heading`, t:`“A Built-In Compass” is a metaphor heading. Its job: tell me this section <b>explains HOW</b> turtles navigate.`},
      {s:`Sidebar: What`, t:`It says lights confuse hatchlings.`},
      {s:`Sidebar: Job`, t:`It <b>adds a related detail</b> (a danger to turtles) and shows how people can <b>help</b>. It's set apart because it's extra information connected to the main idea, not the main explanation.`}
    ]},
  guided:[
    {s:`An article about the Wright brothers includes a <b>timeline</b> from 1896 to 1909. What is the MOST likely job of the timeline?`, o:[[`to show the order of important events in the Wright brothers' work`,1],[`to explain how airplane wings create lift`,`FEATURE_IGNORE`,`A timeline shows events in time order, not how something works.`],[`to show the Wright brothers' opinions`,`FEATURE_IGNORE`,`Timelines list dates and events.`],[`to say that the Wright brothers flew in 1903`,`SECTION_SUMMARY`,`That's one fact on it, not its job.`]], h:`What does any timeline do?`, w:`Timelines show the sequence of events over time.`},
    {s:`A photo of a cracked, dry riverbed has the caption: “Lake Okeechobee's shoreline during the 2011 drought.” How does the caption help the reader?`, o:[[`It explains what and when the photo shows, connecting it to the article's discussion of drought.`,1],[`It shows the lake is always dry.`,`TRUE_NOT_TEXT`,`The caption says “during the 2011 drought,” so it's not always dry.`],[`It tells the reader the photo is of a river.`,`HALF_RIGHT`,`Read the caption closely. It's a lake shoreline.`],[`It makes the article longer.`,`SECTION_SUMMARY`,`Every feature has a real job.`]], h:`Captions explain a picture. What would you NOT know without it?`, w:`Without the caption, you wouldn't know where or when this was, or that it connects to drought.`},
    {s:`An article about volcanoes has a section titled “A Close Call,” which tells the story of a scientist who escaped an eruption. How does this section contribute to the article?`, o:[[`It gives a dramatic real example that shows how dangerous studying volcanoes can be.`,1],[`It tells about a scientist who escaped an eruption.`,`SECTION_SUMMARY`,`That only retells it. Why did the author put it there?`],[`It explains how magma forms underground.`,`TRUE_NOT_TEXT`,`The section is a story, not a science explanation.`],[`It proves volcanoes are not dangerous.`,`TRUE_NOT_TEXT`,`A “close call” shows the opposite!`]], h:`Use a job verb: introduces, explains, gives an example...`, w:`The job is “gives an example”: a true story that shows the danger.`}
  ],
  check:{title:`Inside the Eye`, passages:[{title:`Inside the Eye: How Scientists Study Hurricanes`, paras:[
    `Every year from June through November, people who live along the Atlantic and Gulf coasts keep one eye on the weather. Hurricanes are among the most powerful storms on Earth, capable of pushing walls of seawater inland and tearing roofs from buildings. Yet the more scientists learn about how these storms work, the better they can warn the people in their path.`,
    {h:`A Giant Heat Engine`},
    `A hurricane begins over warm ocean water, usually at least 80 degrees Fahrenheit. Warm, moist air rises from the surface, cools, and forms towering clouds. As the air rises, it leaves an area of lower pressure behind, and more air rushes in to replace it. Because Earth spins, the incoming air begins to rotate. As long as the storm stays over warm water, it keeps drawing up energy, like an engine that never runs out of fuel.`,
    {h:`The Calm at the Center`},
    `At the center of a strong hurricane is the eye, an area often 20 to 40 miles wide where the winds are light and the sky may even be clear. Surrounding the eye is the eyewall, a ring of thunderstorms with the strongest winds of the entire storm. People who experience the eye passing overhead sometimes believe the storm is over, only to be struck by the other side of the eyewall minutes later.`,
    {fig:`<b>[Diagram]</b> A side view of a hurricane. Arrows show warm, moist air spiraling inward along the ocean surface and rising up through the eyewall. The eye at the center is labeled “sinking air, light winds.”<br><b>Caption:</b> Air rises fastest in the eyewall, which is why the strongest winds and heaviest rain are found there.`},
    {h:`Hunting Hurricanes from the Sky`},
    `Satellites can photograph a hurricane from space, but they cannot measure everything happening inside it. That is the job of the Hurricane Hunters, pilots and scientists who fly specially equipped airplanes directly into the storm. They release small instruments called dropsondes, which fall through the hurricane on parachutes and radio back measurements of wind speed, temperature, humidity, and air pressure.`,
    `Each flight is bumpy and dangerous, but the data the crews collect is fed into computer models that predict where a storm will go and how strong it will become. Forecasters say these measurements have helped make hurricane forecasts far more accurate than they were a few decades ago, giving communities more time to prepare.`,
    {side:`<b>Sidebar: Category Check</b><br>The Saffir-Simpson Hurricane Wind Scale rates hurricanes by their sustained wind speed:<br>Category 1: 74–95 mph · Category 2: 96–110 mph · Category 3: 111–129 mph · Category 4: 130–156 mph · Category 5: 157 mph or higher.<br>Storms rated Category 3 and above are called <b>major hurricanes</b>.`},
    `No one can stop a hurricane. But by understanding how hurricanes form, flying into their hearts, and turning measurements into forecasts, scientists give people something nearly as valuable: time to get ready.`
  ]}],
  qs:[
    {s:`How does the section “A Giant Heat Engine” contribute to the article?`, o:[[`It explains how hurricanes form and get their energy, giving background for the rest of the article.`,1],[`It describes the engines on Hurricane Hunter airplanes.`,`WORD_MATCH`],[`It says that warm, moist air rises from the ocean.`,`SECTION_SUMMARY`],[`It warns readers to leave when a hurricane is coming.`,`TRUE_NOT_TEXT`]], w:`Its job is to give background: how hurricanes form. “Engine” is a comparison, not about airplanes.`},
    {s:`What does the diagram and its caption add to the article?`, o:[[`They show visually how air moves in a hurricane and why the eyewall has the strongest winds.`,1],[`They prove that the eye is the most dangerous part of the storm.`,`TRUE_NOT_TEXT`],[`They give the wind speeds for each hurricane category.`,`FEATURE_IGNORE`],[`They show a photograph of a hurricane taken from space.`,`FEATURE_IGNORE`]], w:`The diagram SHOWS air moving; the caption EXPLAINS why the eyewall is strongest. Wind speeds are in the sidebar, a different feature.`},
    {type:`ab`, a:{s:`<b>Part A:</b> Why does the author include the last sentence of the section “The Calm at the Center,” about people who think the storm is over?`, o:[[`to show why understanding the eye matters for people's safety`,1],[`to explain that the sky in the eye may be clear`,`SECTION_SUMMARY`],[`to show that people who live near the coast are foolish`,`TRUE_NOT_TEXT`],[`to explain how dropsondes measure the eye`,`WORD_MATCH`]], w:`The sentence warns of a real danger: the calm eye tricks people.`},
      b:{s:`<b>Part B:</b> Which phrase BEST supports the answer to Part A?`, o:[[`“only to be struck by the other side of the eyewall minutes later”`,1],[`“an area often 20 to 40 miles wide”`,`PART_AB`],[`“the sky may even be clear”`,`PART_AB`],[`“a ring of thunderstorms”`,`PART_AB`]], w:`Being “struck” minutes later shows the safety risk.`}},
    {s:`How does the sidebar “Category Check” help the reader?`, o:[[`It gives a scale for comparing hurricane strength and explains the term “major hurricane.”`,1],[`It tells readers how to prepare their homes.`,`TRUE_NOT_TEXT`],[`It explains how Hurricane Hunters fly into storms.`,`FEATURE_IGNORE`],[`It shows that all hurricanes are Category 5.`,`TRUE_NOT_TEXT`]], w:`A sidebar adds related, extra information. This one gives the rating scale and defines “major hurricane.”`},
    {s:`How does the conclusion (the last paragraph) connect to the introduction?`, o:[[`It returns to the idea of warning people, showing that science gives communities time to prepare.`,1],[`It introduces a brand-new topic about stopping hurricanes.`,`SECTION_SUMMARY`],[`It repeats the wind speeds from the sidebar.`,`FEATURE_IGNORE`],[`It argues that hurricanes are not really dangerous.`,`TRUE_NOT_TEXT`]], w:`The introduction says scientists can “warn the people in their path.” The conclusion finishes that idea: “time to get ready.”`}
  ]}
});

LESSONS.push({
  id:`r24`, code:`ELA.6.R.2.4`, cat:`it`, title:`Tracking an Argument & Types of Reasoning`,
  std:`Track the development of an argument, identifying the types of reasoning used.`,
  learn:[
    `<div class="appeals"><div><h4>Claim</h4><p>What the author wants you to believe or do. Often uses <em>should, must, need to</em>.</p></div><div><h4>Reasons</h4><p>WHY the claim is right. Usually the topic sentences of body paragraphs.</p></div><div><h4>Evidence</h4><p>PROOF: facts, statistics, examples, expert quotes, stories.</p></div></div>`,
    `<p><b>Counterclaim</b> = the other side's argument (“Some people argue...”). <b>Rebuttal</b> = the author's answer to it (“However...”). Including both makes an argument stronger.</p>`,
    `<h4>Two types of reasoning</h4><table class="tbl"><tr><th>Inductive ⬆️</th><th>Deductive ⬇️</th></tr><tr><td><b>Specific → General.</b> Several examples or facts build UP to a big conclusion.</td><td><b>General → Specific.</b> Starts with a big rule and applies it DOWN to one case.</td></tr><tr><td>“Pine Ridge added recess and grades rose. Oak Grove did too. So did Lakeview. Recess seems to help students.”</td><td>“Students learn better when they move. Sixth graders are students. So sixth graders need recess.”</td></tr></table>`,
    `<p class="tip">🧠 <b>Memory trick:</b> <b>IN</b>ductive = examples come <b>IN</b> and build up. <b>DE</b>ductive = a rule comes <b>DOWN</b> (<em>de-</em> means down!).</p>`
  ],
  move:{name:`The C-R-E Track`, steps:[`Find the <b>Claim</b> (intro or conclusion; look for “should”).`,`Find each <b>Reason</b> (first sentence of body paragraphs; “First,” “Second,” “Most importantly”).`,`Label the <b>Evidence</b> (fact, number, example, expert, story).`,`Look for the <b>counterclaim</b> (“Some argue...”) and the <b>rebuttal</b> (“However...”).`,`Ask which way the reasoning flows: examples ⬆️ to a rule (inductive) or rule ⬇️ to a case (deductive).`]},
  model:{title:`Watch me do it`, passage:[`(1) Our school should add a 15-minute recess for sixth graders. (2) Exercise helps every brain focus, and sixth graders have brains, so recess would help them focus. (3) Some say there's no time in the schedule. (4) However, a few minutes of movement makes the remaining class time more productive.`],
    think:[
      {s:`Claim`, t:`Sentence 1, “should add a recess.” That's the claim.`},
      {s:`Reasoning`, t:`Sentence 2 starts with a general rule (exercise helps EVERY brain) and applies it to one group (sixth graders). Rule ⬇️ case = <b>deductive</b>.`},
      {s:`Counterclaim`, t:`Sentence 3, “Some say...” = the other side.`},
      {s:`Rebuttal`, t:`Sentence 4, “However...” = the author answers back.`}
    ]},
  guided:[
    {s:`Which sentence is the author's CLAIM in an essay about school lunches?`, o:[[`Schools should give students at least 30 minutes to eat lunch.`,1],[`Many students get only 15 minutes to eat after waiting in line.`,`CLAIM_EVIDENCE`,`That's a fact that could be evidence.`],[`A study found that rushed students threw away more vegetables.`,`CLAIM_EVIDENCE`,`That's evidence from a study.`],[`Lunch is served in the cafeteria.`,`CLAIM_EVIDENCE`,`That's a fact nobody would argue about.`]], h:`A claim is something someone could argue about. Look for “should.”`, w:`It's an opinion the author is trying to prove, so it's the claim.`},
    {s:`“At Lincoln Middle, a reading club raised scores. At Bay Middle, a reading club raised scores. At Coral Middle, a reading club raised scores too. Reading clubs seem to improve reading.” What type of reasoning is this?`, o:[[`inductive`,1],[`deductive`,`REASONING_TYPE`,`It doesn't start with a rule. It starts with examples. Which way does it flow?`],[`counterclaim`,`CLAIM_EVIDENCE`,`No one is giving the other side here.`],[`ethos`,`APPEAL_MIX`,`Ethos is an appeal, not a type of reasoning.`]], h:`Does it start with examples or with a rule?`, w:`Three specific examples build UP to a general conclusion. Examples come IN = inductive.`},
    {s:`“Some people say homework helps students practice. However, research shows that for young students, too much homework adds stress without improving grades.” What is the job of the sentence that begins with “However”?`, o:[[`It is a rebuttal that answers the counterclaim.`,1],[`It is the counterclaim.`,`CLAIM_EVIDENCE`,`The counterclaim is the “Some people say” sentence.`],[`It is inductive reasoning.`,`REASONING_TYPE`,`It doesn't list several examples.`],[`It agrees with the other side.`,`TRUE_NOT_TEXT`,`“However” signals the author disagrees.`]], h:`“However” signals the author is answering back.`, w:`The author responds to the other side with evidence. That's a rebuttal.`}
  ],
  check:{title:`Every Florida Student Should Learn to Swim`, passages:[{title:`Every Florida Student Should Learn to Swim`, note:`(This essay was written for practice.)`, paras:[
    `Florida is surrounded on three sides by water. It has more than a thousand miles of coastline, thousands of lakes, hundreds of springs, and swimming pools in countless backyards and apartment complexes. Yet many Florida children reach middle school without knowing how to swim safely. For a state shaped by water, that is a dangerous gap. Florida schools should make swimming lessons a required part of physical education.`,
    `The most important reason is safety. Florida has one of the highest numbers of child drownings in the country, and drowning can happen in less than a minute, often without splashing or shouting. Researchers have found that children who have taken formal swimming lessons are less likely to drown than children who have not. Learning to float, tread water, and reach the edge of a pool are skills that can mean the difference between a scary moment and a tragedy.`,
    `Second, swimming lessons at school would reach children who might never get them otherwise. Private lessons can be expensive, and not every family lives near a pool or has time to drive to one. When swimming is part of the school day, every child gets the same chance to learn, no matter where they live or how much money their family has.`,
    `Consider what has happened in places that have tried this approach. Some school districts have partnered with community pools to bring entire grade levels for lessons. Teachers in these programs report that students who were once afraid of the water became confident enough to float on their own. Parents in these communities say their children now ask to go to the beach instead of avoiding it. When program after program shows similar results, it is reasonable to conclude that school-based lessons work.`,
    `Some people argue that schools are already too busy and that teaching swimming should be the job of parents. It is true that teachers have a great deal to cover. However, schools already teach other life-saving skills, such as fire drills and basic first aid, because those skills protect students outside the classroom. Swimming is a life-saving skill, so it belongs on that list. A few weeks of lessons is a small cost compared with a life.`,
    `Florida’s beaches, rivers, and springs are some of its greatest treasures. Every child who grows up here deserves to enjoy them safely. Required swimming lessons would give them the skills to do just that.`
  ]}],
  qs:[
    {s:`What is the author's claim?`, o:[[`Florida schools should make swimming lessons a required part of physical education.`,1],[`Florida has many lakes, springs, and miles of coastline.`,`CLAIM_EVIDENCE`],[`Drowning can happen in less than a minute.`,`CLAIM_EVIDENCE`],[`Parents should be the ones to teach their children to swim.`,`TRUE_NOT_TEXT`]], w:`The claim is the “should” statement the whole essay argues for. Choice D is the counterclaim, which the author disagrees with.`},
    {s:`What type of reasoning does the author use in paragraph 4?`, o:[[`inductive, because several examples lead to a general conclusion`,1],[`deductive, because a general rule is applied to one specific case`,`REASONING_TYPE`],[`an emotional appeal with no reasoning`,`APPEAL_MIX`],[`a counterclaim against the author's own argument`,`CLAIM_EVIDENCE`]], w:`“Program after program shows similar results... it is reasonable to conclude.” Examples build UP = inductive.`},
    {type:`ab`, a:{s:`<b>Part A:</b> How does paragraph 5 develop the argument?`, o:[[`It responds to a counterclaim with a reason swimming belongs in school.`,1],[`It agrees that schools are too busy to teach swimming.`,`HALF_RIGHT`],[`It introduces a new claim about fire drills.`,`WORD_MATCH`],[`It provides statistics about drowning.`,`CLAIM_EVIDENCE`]], w:`The paragraph presents the other side, then answers it.`},
      b:{s:`<b>Part B:</b> Which sentence from paragraph 5 shows the author's response to the counterclaim?`, o:[[`“However, schools already teach other life-saving skills, such as fire drills and basic first aid”`,1],[`“Some people argue that schools are already too busy”`,`PART_AB`],[`“It is true that teachers have a great deal to cover.”`,`PART_AB`],[`“Florida’s beaches, rivers, and springs are some of its greatest treasures.”`,`PART_AB`]], w:`“However” starts the rebuttal. Choice B IS the counterclaim, and choice C admits part of it.`}},
    {s:`Read this reasoning from paragraph 5: “schools already teach other life-saving skills... Swimming is a life-saving skill, so it belongs on that list.” What type of reasoning is this?`, o:[[`deductive`,1],[`inductive`,`REASONING_TYPE`],[`a counterclaim`,`CLAIM_EVIDENCE`],[`a personal story`,`CLAIM_EVIDENCE`]], w:`General rule (schools teach life-saving skills) → specific case (swimming is one) → conclusion. Rule DOWN to a case = deductive.`},
    {type:`multi`, n:2, s:`Select <b>TWO</b> details that support the reason in paragraph 3, that school lessons would reach children who might not get them otherwise.`, o:[[`“Private lessons can be expensive”`,1],[`“not every family lives near a pool or has time to drive to one”`,1],[`“drowning can happen in less than a minute”`,`CLAIM_EVIDENCE`],[`“Florida is surrounded on three sides by water.”`,`CLAIM_EVIDENCE`],[`“fire drills and basic first aid”`,`WORD_MATCH`]], w:`Cost and distance explain why some kids never get lessons. The other details support different parts of the argument.`}
  ]}
});

LESSONS.push({
  id:`r23`, code:`ELA.6.R.2.3`, cat:`it`, title:`Same Event, Different Purposes`,
  std:`Analyze authors' purpose(s) in multiple accounts of the same event or topic.`,
  learn:[
    `<p>Two people can write about the <b>exact same event</b> for very different reasons. FAST will give you two accounts and ask how the authors' <b>purposes</b> are different, and how you can tell.</p>`,
    `<h4>Purposes (beyond “inform”)</h4><div class="chips"><span>to inform</span><span>to explain</span><span>to persuade</span><span>to entertain</span><span>to express feelings</span><span>to reassure</span><span>to criticize</span><span>to warn</span><span>to celebrate</span><span>to reflect</span></div>`,
    `<h4>Clues to purpose</h4><ul><li><b>Who wrote it, for whom?</b> A company? A witness? A reporter?</li><li><b>What details did they CHOOSE</b> (and leave out)? Numbers? Feelings? Praise?</li><li><b>Word choice:</b> neutral (“reported”) or loaded (“promised four times”)?</li><li><b>Point of view:</b> “I” (personal) or “the company” (official)?</li></ul>`
  ],
  move:{name:`The Two-Lens Move`, steps:[`For EACH account: Who wrote it, and who is the audience?`,`Which details did the author choose? What's missing?`,`How do the words feel?`,`Name each purpose with a strong verb.`,`Compare: how are they different, and which details prove it?`]},
  model:{title:`Watch me do it`, passage:[`<b>Account A (school newspaper):</b> The Pelicans lost the championship game 54–51 on Friday. Guard Tasha Moore scored 22 points. The team finished the season 18–4.`, `<b>Account B (Tasha's journal):</b> I missed the last shot. I can still hear the buzzer. But Coach hugged me and said 18 wins is history, and somehow I believe her.`],
    think:[
      {s:`A's details`, t:`Score, points, record. Only facts. Neutral words. Purpose: <b>to inform</b> readers about the game.`},
      {s:`B's details`, t:`“I missed,” “I can still hear the buzzer,” Coach's hug. Feelings. Purpose: <b>to express and reflect</b> on her disappointment and how she's healing.`},
      {s:`Compare`, t:`Same game, but A informs with numbers, and B expresses personal feelings. The <b>details chosen</b> prove it.`}
    ]},
  guided:[
    {s:`A zoo's website says: “Our new elephant habitat is 10 acres and includes a 500,000-gallon pool.” A visitor's review says: “The elephants still looked bored to me, swaying in the same corner all afternoon.” How are the purposes different?`, o:[[`The website promotes the habitat; the visitor expresses doubt that the elephants are happy.`,1],[`Both want people to visit the zoo.`,`PURPOSE_SINGLE`,`Does the visitor sound like they're promoting it?`],[`Both only give facts and statistics.`,`PURPOSE_SINGLE`,`The review gives an opinion.`],[`The website criticizes the zoo; the visitor praises it.`,`HALF_RIGHT`,`That's reversed.`]], h:`Who wrote each one, and how do their words feel?`, w:`The zoo chose impressive numbers to promote. The visitor chose a sad detail to express concern.`},
    {s:`Which detail would MOST likely appear in a city's official report about a parade, rather than in a child's diary?`, o:[[`“Approximately 12,000 people attended, and streets reopened by 4 p.m.”`,1],[`“The marching band was so loud my heart thumped.”`,`PURPOSE_SINGLE`,`That's a personal feeling, which fits a diary.`],[`“I got cotton candy all over my shirt!”`,`PURPOSE_SINGLE`,`That's personal and fun, not official.`],[`“It was the best day ever.”`,`PURPOSE_SINGLE`,`That's an opinion and a feeling.`]], h:`Official reports inform with facts.`, w:`Numbers and logistics fit an official purpose: to inform.`},
    {s:`A news article reports that a new highway will cut travel time by 15 minutes. A letter from a nearby resident says the highway will “bulldoze the last wild woods in our neighborhood.” What does the word choice “bulldoze” show about the resident's purpose?`, o:[[`It shows the resident wants to criticize the highway and make readers oppose it.`,1],[`It shows the resident is only explaining how highways are built.`,`CONNOTATION`,`“Bulldoze the last wild woods” has a strong negative feeling.`],[`It shows the resident agrees with the article.`,`PURPOSE_SINGLE`,`Same topic, different purpose!`],[`It shows the resident is a construction worker.`,`TRUE_NOT_TEXT`,`Nothing suggests that.`]], h:`What feeling does “bulldoze the last wild woods” create?`, w:`Loaded, negative words show a purpose to criticize and persuade.`}
  ],
  check:{title:`The Night the Lights Went Out`, passages:[
    {title:`Account 1 — Press Release: Gulf Coast Power Restores Service to 98 Percent of Customers`, note:`(Both accounts were written for practice. The storm, company, and people are made up.)`, paras:[
      `PALM HARBOR — Gulf Coast Power announced Monday that electricity has been restored to 98 percent of customers who lost service when Tropical Storm Marisol moved through the area on Thursday night. More than 1,200 line workers, including crews from six states, have worked around the clock since Friday morning.`,
      `“Our crews faced flooded roads, fallen trees, and more than 400 broken poles,” said company spokesperson Darnell Price. “Safety is always our first priority, and we are grateful for our customers’ patience.”`,
      `The company expects the remaining customers, mostly in heavily wooded areas, to have power by Wednesday evening. Customers can check estimated restoration times on the company’s website.`
    ]},
    {title:`Account 2 — Newspaper Column: “Four Days in the Dark” by Renee Castillo`, paras:[
      `On the third night without power, I sat on my front steps with a flashlight and watched my neighbor’s generator hum while my refrigerator full of groceries slowly turned into a science experiment. My eighty-year-old father, who lives with us, could not use the machine that helps him breathe at night, so we drove him to my sister’s house forty minutes away.`,
      `I do not blame the line workers. I saw them on our street at midnight, soaked and exhausted, and I brought them bottled water. What I blame is the silence. The power company’s website listed our neighborhood as “assessing damage” for three days. The text alerts promised “restoration within 24 hours” four separate times.`,
      `People can handle bad news. What they cannot handle is not knowing. Before the next storm, Gulf Coast Power owes its customers honest, specific updates, even when the answer is “we don’t know yet.”`
    ]}
  ],
  qs:[
    {s:`What is the MAIN purpose of Account 1?`, o:[[`to inform customers about progress and reassure them that the company is working hard`,1],[`to criticize customers for being impatient`,`TRUE_NOT_TEXT`],[`to entertain readers with an exciting storm story`,`PURPOSE_SINGLE`],[`to persuade readers to buy generators`,`TRUE_NOT_TEXT`]], w:`The press release uses numbers (98%, 1,200 workers) and thanks customers. It informs and reassures.`},
    {s:`What is the MAIN purpose of Account 2?`, o:[[`to express frustration and persuade the power company to give honest, specific updates`,1],[`to inform readers how many poles were broken`,`PURPOSE_SINGLE`],[`to blame the line workers for the slow repairs`,`TRUE_NOT_TEXT`],[`to entertain readers with a funny story about groceries`,`FIG_NO_TONE`]], w:`She shares her hardship, criticizes the “silence,” and ends with what the company “owes” customers. She is expressing feelings AND persuading.`},
    {type:`ab`, a:{s:`<b>Part A:</b> How do the details in the two accounts differ?`, o:[[`Account 1 focuses on numbers and the company's effort, while Account 2 focuses on personal hardship and poor communication.`,1],[`Both accounts focus mainly on the bravery of the line workers.`,`PURPOSE_SINGLE`],[`Account 1 uses personal stories, while Account 2 uses statistics.`,`HALF_RIGHT`],[`Both accounts include the same details in a different order.`,`PURPOSE_SINGLE`]], w:`Each author chose details that fit their purpose.`},
      b:{s:`<b>Part B:</b> Which pair of details BEST supports the answer to Part A?`, o:[[`“More than 1,200 line workers... have worked around the clock” AND “could not use the machine that helps him breathe at night”`,1],[`“Customers can check estimated restoration times” AND “I brought them bottled water”`,`PART_AB`],[`“Safety is always our first priority” AND “I do not blame the line workers”`,`PART_AB`],[`“mostly in heavily wooded areas” AND “People can handle bad news”`,`PART_AB`]], w:`One shows the company's numbers and effort, and the other shows a personal hardship.`}},
    {s:`Why does the columnist include the sentences “I do not blame the line workers... I brought them bottled water”?`, o:[[`to show she is being fair and to focus her criticism on the company's communication`,1],[`to show she is angry at the line workers`,`TRUE_NOT_TEXT`],[`to inform readers how many workers came`,`WORD_MATCH`],[`to agree with the press release that everything went well`,`HALF_RIGHT`]], w:`By praising the workers, she makes clear that her complaint is about the “silence,” not the repair crews. (It also makes her seem fair, which builds ethos!)`},
    {type:`multi`, n:2, s:`Select <b>TWO</b> phrases from Account 2 that show the columnist's purpose to criticize the company.`, o:[[`“What I blame is the silence.”`,1],[`“promised ‘restoration within 24 hours’ four separate times”`,1],[`“we are grateful for our customers’ patience”`,`PURPOSE_SINGLE`],[`“Customers can check estimated restoration times on the company’s website.”`,`PURPOSE_SINGLE`],[`“I saw them on our street at midnight”`,`HALF_RIGHT`]], w:`Both point to the company's failure to communicate honestly. Choices C and D come from Account 1.`}
  ]}
});
