<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Time to Climb Student</title>

<style>
/* Layout: a single trail column (max 880px) — header bar, hero with trail stats, route list; lessons are stepped cards. */
:root{
  --bg:#f2f6f8; --surface:#ffffff; --ink:#1d2a33; --muted:#5b6b75; --line:#d8e2e8;
  --accent:#1f7a8c; --accent-ink:#ffffff; --accent-soft:#e1f1f4;
  --gv:#6a4fd6; --gv-soft:#eeeafe; --it:#0f8a74; --it-soft:#e0f4ef; --pp:#d9573a; --pp-soft:#fdeae4;
  --ok:#1f8a4c; --ok-soft:#e3f5ea; --no:#c2410c; --no-soft:#fdeee5; --gold:#e8a817; --gold-soft:#fff6dc;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Verdana", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11181d; --surface:#1a242b; --ink:#e7eef2; --muted:#9fb0ba; --line:#2c3a43;
  --accent:#4fb6c9; --accent-ink:#0b1a1f; --accent-soft:#163038;
  --gv:#a996ff; --gv-soft:#272245; --it:#45c7a8; --it-soft:#15322c; --pp:#ff8a6b; --pp-soft:#3a2119;
  --ok:#5fd18f; --ok-soft:#173226; --no:#ff9b6b; --no-soft:#3a2117; --gold:#f5c451; --gold-soft:#352c14; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11181d; --surface:#1a242b; --ink:#e7eef2; --muted:#9fb0ba; --line:#2c3a43;
  --accent:#4fb6c9; --accent-ink:#0b1a1f; --accent-soft:#163038;
  --gv:#a996ff; --gv-soft:#272245; --it:#45c7a8; --it-soft:#15322c; --pp:#ff8a6b; --pp-soft:#3a2119;
  --ok:#5fd18f; --ok-soft:#173226; --no:#ff9b6b; --no-soft:#3a2117; --gold:#f5c451; --gold-soft:#352c14; color-scheme:dark }
*{box-sizing:border-box} [hidden]{display:none!important}
body{background:var(--bg); color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.55; margin:0}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--surface)}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--display); line-height:1.15; text-wrap:balance; margin:0 0 .4em}
h1{font-size:clamp(1.8rem,4.5vw,2.5rem)} h2{font-size:1.5rem} h3{font-size:1.25rem} h4{font-size:1.02rem; margin:1.1em 0 .4em}
p{margin:0 0 .8em}
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--surface); border-bottom:1px solid var(--line)}
.top .in{max-width:880px; margin:0 auto; display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding-block:10px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--display); font-weight:800; font-size:1.2rem; color:var(--ink); text-decoration:none; margin-right:auto; display:flex; align-items:center; gap:8px}
.brand svg{flex:none}
.topnav{display:flex; gap:4px; flex-wrap:wrap}
.topnav a{padding:6px 12px; border-radius:999px; text-decoration:none; color:var(--muted); font-weight:700; font-size:.95rem}
.topnav a.on{background:var(--accent-soft); color:var(--accent)}
#stopRead{display:none} body.speaking #stopRead{display:inline-flex}
#saved{font-size:.8rem; color:var(--ok); opacity:0; transition:opacity .3s} #saved.on{opacity:1}
main{max-width:880px; margin:0 auto; padding-block:20px 60px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); display:grid; gap:18px}
#app{display:grid; gap:18px; min-width:0}
.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px; min-width:0}
.card.center{text-align:center}
.btn{display:inline-flex; align-items:center; gap:8px; background:var(--accent); color:var(--accent-ink); border:0; border-radius:12px; padding:11px 18px; font:700 1rem var(--body); cursor:pointer; text-decoration:none}
.btn.big{font-size:1.1rem; padding:14px 22px}
.btn.ghost{background:transparent; color:var(--accent); border:2px solid var(--accent)}
.btn:disabled{opacity:.5; cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,.tab:focus-visible,a:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
.linkbtn{background:none; border:0; color:var(--accent); font:inherit; text-decoration:underline; cursor:pointer; padding:0}
.read{background:var(--accent-soft); color:var(--accent); border:0; border-radius:999px; padding:6px 12px; font:700 .9rem var(--body); cursor:pointer; flex:none}
.read.sm{padding:4px 9px}
.small{font-size:.88rem; color:var(--muted)}
.eyebrow{text-transform:uppercase; letter-spacing:.08em; font-size:.78rem; font-weight:700; color:var(--accent); margin-bottom:.3em}
.lead{color:var(--muted); font-size:1.05rem}

.hero{display:grid; grid-template-columns:1.4fr 1fr; gap:20px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:24px; position:relative; overflow:hidden}
.hero::after{content:""; position:absolute; right:-40px; bottom:-30px; width:260px; height:140px; background:linear-gradient(135deg,transparent 49%,var(--accent-soft) 50%); opacity:.9; pointer-events:none}
.hero > *{position:relative; z-index:1; min-width:0}
.dash{display:grid; gap:10px}
.tile{background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:12px 14px; text-decoration:none; color:var(--ink); display:block}

.tnum{font-family:var(--display); font-weight:800; font-size:2rem; line-height:1; font-variant-numeric:tabular-nums}

.bar{height:8px; background:var(--line); border-radius:9px; margin-top:8px; overflow:hidden} .bar i{display:block; height:100%; background:var(--ok); border-radius:9px}
@media (max-width:700px){ .hero{grid-template-columns:1fr} }
/* route */
.sechead p{color:var(--muted)}
.route{list-style:none; padding:0; margin:0; display:grid; gap:0; position:relative}

.route li::before{content:""; position:absolute; left:8px; top:0; bottom:0; width:3px; background:var(--line)}
.route li::after{content:""; position:absolute; left:3px; top:50%; width:13px; height:13px; margin-top:-6px; border-radius:50%; background:var(--surface); border:3px solid var(--accent)}
.route li.today{background:var(--gold-soft); border-radius:10px}
.route li.summit::after{background:var(--gold); border-color:var(--gold)}
.date{font-weight:700; font-variant-numeric:tabular-nums; font-size:.92rem}
.now{display:inline-block; background:var(--gold); color:#2b2100; font-size:.7rem; padding:1px 6px; border-radius:6px; margin-left:4px}
.rtitle{min-width:0}
.row-act{display:flex; align-items:center; gap:10px}
.tick{font-size:.85rem; color:var(--muted); display:flex; gap:4px; align-items:center}
.status{font-weight:700; text-decoration:none; white-space:nowrap; font-size:.92rem; padding:5px 10px; border-radius:999px}
.status.go{background:var(--accent); color:var(--accent-ink)} .status.done{background:var(--ok-soft); color:var(--ok)} .status.pm{background:var(--gold-soft); color:var(--ink)}
@media (max-width:600px){ .route li{grid-template-columns:1fr; gap:4px} }
.chip{display:inline-block; font-size:.75rem; font-weight:700; padding:2px 9px; border-radius:999px; vertical-align:middle; letter-spacing:.02em}
.c-gv{background:var(--gv-soft); color:var(--gv)} .c-it{background:var(--it-soft); color:var(--it)} .c-pp{background:var(--pp-soft); color:var(--pp)} .c-mix{background:var(--gold-soft); color:var(--ink)} .c-fix{background:var(--accent-soft); color:var(--accent)}
.grid3{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px}
.mini{display:grid; gap:4px; padding:14px; border:1px solid var(--line); border-radius:12px; text-decoration:none; color:var(--ink); background:var(--bg)}
.mini span{font-size:.88rem; color:var(--muted)} .mini em{font-style:normal; color:var(--accent); font-weight:700}
.cats .tile{border-top:5px solid var(--line)} .c-gvb{border-top-color:var(--gv)!important} .c-itb{border-top-color:var(--it)!important} .c-ppb{border-top-color:var(--pp)!important}
/* lesson */
.lhead h1{margin-top:.2em}
.code{font-size:.8rem; color:var(--muted); letter-spacing:.04em}
.tabs{display:grid; grid-template-columns:repeat(6,1fr); gap:6px}
.tab{display:grid; gap:2px; justify-items:center; text-align:center; background:var(--surface); border:2px solid var(--line); border-radius:12px; padding:8px 4px; cursor:pointer; color:var(--ink); font-family:var(--body)}
.tab .tn{width:26px; height:26px; border-radius:50%; display:grid; place-items:center; background:var(--line); font-weight:700; font-size:.85rem}
.tab .tl{font-weight:700; font-size:.82rem; line-height:1.15} .tab .tm{font-size:.72rem; color:var(--muted)}
.tab.past .tn{background:var(--ok); color:#fff} .tab.on{border-color:var(--accent); background:var(--accent-soft)} .tab.on .tn{background:var(--accent); color:var(--accent-ink)}
@media (max-width:640px){ .tabs{grid-template-columns:repeat(3,1fr)} }
.stepbody{display:grid; gap:16px; min-width:0}
.stepnav{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap}
.ptop{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
.std{background:var(--accent-soft); border-radius:10px; padding:10px 14px}
.tblwrap{overflow-x:auto}
.tbl{border-collapse:collapse; width:100%; font-size:.95rem; margin:.4em 0 1em}
.tbl th,.tbl td{border:1px solid var(--line); padding:8px 10px; text-align:left; vertical-align:top}
.tbl th{background:var(--bg); font-size:.85rem}
.tbl td.good{background:var(--ok-soft)}
.tbl .num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
.chips{display:flex; flex-wrap:wrap; gap:6px} .chips span{background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:3px 9px; font-size:.92rem}
.trio{display:flex; gap:8px; flex-wrap:wrap} .trio span{padding:4px 10px; border-radius:8px; font-weight:700}
.pos{background:var(--ok-soft); color:var(--ok)} .neu{background:var(--bg); border:1px solid var(--line)} .neg{background:var(--no-soft); color:var(--no)}
.tip{background:var(--gold-soft); border-radius:10px; padding:10px 14px}
.appeals{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; margin-bottom:1em}
.appeals > div{background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:12px} .appeals h4{margin-top:0} .appeals .ex{font-style:italic; color:var(--muted); margin:0}
.move{background:var(--surface); border:2px solid var(--accent); border-radius:14px; padding:18px 20px}
.move ol{margin:0; padding-left:1.3em; display:grid; gap:6px}
.model{background:var(--bg); border-left:4px solid var(--accent); padding:12px 16px; border-radius:0 10px 10px 0; font-size:1.05rem}
.think{list-style:none; padding:0; display:grid; gap:10px; counter-reset:t}
.think li{display:grid; grid-template-columns:auto 1fr; gap:12px; align-items:start; animation:pop .35s ease}
.think .sl{background:var(--accent); color:var(--accent-ink); font-weight:700; font-size:.85rem; padding:3px 10px; border-radius:999px; white-space:nowrap}
.think p{margin:0}

@media (prefers-reduced-motion: reduce){ .think li{animation:none} }
.wl{padding-left:1.1em; display:grid; gap:8px}
.st{display:inline-block; font-size:.75rem; font-weight:700; padding:2px 8px; border-radius:6px}
.st.watch{background:var(--no-soft); color:var(--no)} .st.stronger{background:var(--gold-soft); color:var(--ink)} .st.fixed{background:var(--ok-soft); color:var(--ok)}

.checkwrap{display:grid; gap:16px}
.passages{display:grid; gap:14px}
.passage{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px 22px; font-size:1.08rem; line-height:1.7}
.passage h3{font-size:1.3rem}
.para,.stanza{display:grid; grid-template-columns:28px 1fr; gap:6px}
.para p,.stanza p{margin:0 0 .9em; max-width:68ch}
.pn{font-size:.78rem; font-weight:700; color:var(--muted); padding-top:.35em; text-align:right; font-variant-numeric:tabular-nums}
.poem .stanza p{font-style:normal}
.ph{font-family:var(--display); font-size:1.1rem; color:var(--accent); margin:.6em 0 .3em 34px}

.side{margin:.4em 0 1em 34px; background:var(--gold-soft); border-radius:10px; padding:12px 14px; font-size:.95rem}
.note{font-size:.85rem; color:var(--muted); font-style:italic}
/* questions */
.qlist{display:grid; gap:14px}
.q{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 18px; min-width:0}
.qhead{display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:start; margin-bottom:10px}
.qnum{background:var(--ink); color:var(--surface); font-weight:700; border-radius:8px; padding:2px 9px; font-size:.9rem; font-variant-numeric:tabular-nums}
.qs{font-weight:700; min-width:0}
.pill{display:inline-block; background:var(--gold-soft); color:var(--ink); font-size:.75rem; padding:1px 8px; border-radius:999px; font-weight:700}
.tag{display:inline-block; background:var(--bg); border:1px solid var(--line); font-size:.72rem; padding:0 7px; border-radius:6px; margin-right:4px; font-weight:700}
.readsrc{display:none}
.opts{display:grid; gap:8px}
.opt{display:grid; grid-template-columns:34px 1fr; gap:10px; align-items:center; text-align:left; width:100%; background:var(--bg); border:2px solid var(--line); border-radius:12px; padding:10px 12px; font:inherit; color:var(--ink); cursor:pointer; min-height:48px}
.opt-l{width:30px; height:30px; border-radius:50%; display:grid; place-items:center; background:var(--surface); border:2px solid var(--line); font-weight:700}
.opt.on{border-color:var(--accent); background:var(--accent-soft)} .opt.on .opt-l{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.opt.right{border-color:var(--ok); background:var(--ok-soft)} .opt.right .opt-l{background:var(--ok); border-color:var(--ok); color:#fff}
.opt.wrong{border-color:var(--no); background:var(--no-soft)} .opt.wrong .opt-l{background:var(--no); border-color:var(--no); color:#fff}
.opt:disabled{cursor:default}
.hint{margin-top:10px} .hint summary{cursor:pointer; font-weight:700; color:var(--accent)} .hint p{margin:.4em 0 0}
.fb{margin-top:10px; border-radius:10px; padding:10px 14px}
.fb.ok{background:var(--ok-soft)} .fb.no{background:var(--no-soft)}
.trap{display:block; margin-top:6px; font-size:.92rem}
.remind{background:var(--gold-soft); border-radius:10px; padding:8px 12px; font-size:.92rem; margin-bottom:10px}
.ab{display:grid; gap:10px; border-left:4px solid var(--gold); padding-left:10px}
.abtag{font-size:.78rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.06em}
.fixlabel{font-size:.8rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:-8px}
.submitbar{background:var(--surface); border:2px solid var(--accent); border-radius:14px; padding:16px 18px; text-align:center}
.result,.momcard{background:var(--surface); border:3px solid var(--gold); border-radius:18px; padding:22px}
.momcard.inline{border-width:2px; padding:12px 14px; margin:10px 0}
.score{display:flex; gap:18px; align-items:center; margin-bottom:10px}
.score .big{font-family:var(--display); font-weight:800; font-size:3rem; line-height:1; font-variant-numeric:tabular-nums}
.msg{font-size:1.1rem}
.formom{background:var(--bg); border-radius:12px; padding:14px 16px; margin:14px 0}
.formom h4{margin-top:0}
.momchk{display:flex; gap:10px; align-items:center; font-weight:700; background:var(--ok-soft); border-radius:10px; padding:10px 14px; cursor:pointer}
.momchk input{width:22px; height:22px}
.done-note{color:var(--ok); font-weight:700}
.pc{font-weight:700; padding:1px 7px; border-radius:6px} .pc.g{background:var(--ok-soft); color:var(--ok)} .pc.y{background:var(--gold-soft)} .pc.r{background:var(--no-soft); color:var(--no)}
.ladder{display:grid; grid-template-columns:repeat(3,1fr); gap:4px; margin:1em 0 1.6em}
.rung{position:relative; padding:10px; border-radius:8px; font-size:.85rem; display:grid}
.rung span{font-variant-numeric:tabular-nums; color:var(--muted)}
.rung.l2{background:var(--no-soft)} .rung.l3{background:var(--gold-soft)} .rung.l4{background:var(--ok-soft)}
.mark{position:absolute; bottom:-22px; font-style:normal; font-weight:700; font-size:.78rem; color:var(--ink); white-space:nowrap}
.mark::before{content:"▲ "}
.find{display:grid; gap:8px; padding-left:1.2em}
#toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,40px); background:var(--ink); color:var(--surface); padding:10px 16px; border-radius:10px; opacity:0; transition:.25s; z-index:20; max-width:90vw}
#toast.on{opacity:1; transform:translate(-50%,0)}
.namebox{display:grid; gap:6px; margin:6px 0 14px; font-weight:700} .namebox div{display:flex; gap:8px; flex-wrap:wrap} .namebox input{font:inherit; padding:10px 12px; border:2px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink); min-width:0; flex:1}
.confetti{position:fixed; inset:0; pointer-events:none; z-index:30}
</style>

<script>
// ===== Misconception catalog: each wrong answer choice is tagged with one of these =====
const MIS = {
  CONTEXT_SKIP: {name:`Guessing a word without using the clues`, fix:`Read the sentence before AND after the word. Find the clue, predict a meaning, then plug your meaning back into the sentence to test it.`},
  CONNOTATION: {name:`Missing the feeling of a word`, fix:`Words have a dictionary meaning AND a feeling (positive, negative, or neutral). Ask: does this answer match the feeling the author created?`},
  WORD_MATCH: {name:`Picking an answer just because it uses the same words as the text`, fix:`Matching WORDS is a trap. Look for matching MEANING. FAST often puts passage words in wrong answers on purpose.`},
  ROOT_MIX: {name:`Mixing up roots, prefixes, or suffixes`, fix:`Break the word into parts. Define EACH part (prefix + root + suffix), then put the meanings together. Check it in the sentence.`},
  LITERAL_FIG: {name:`Reading figurative language as if it really happened`, fix:`If it can't really happen, it's figurative. Ask: what two things are being compared, and what does the comparison REALLY mean?`},
  FIG_NO_TONE: {name:`Naming the device but missing its effect`, fix:`Don't stop at "it's a simile." Ask "So what?" What feeling or idea does the comparison create? That's the answer FAST wants.`},
  DETAIL_CENTRAL: {name:`Choosing one detail instead of the big idea`, fix:`Use the umbrella test: the central idea or theme must cover the WHOLE text, not just one paragraph or one interesting fact.`},
  TOO_BROAD: {name:`Choosing an answer that is too big or general`, fix:`An answer that could fit almost ANY text is too broad. The right answer is about THIS text's specific point.`},
  TRUE_NOT_TEXT: {name:`Choosing something that isn't in the text (or goes against it)`, fix:`Prove it! If you can't put your finger on the words in the text that support an answer, it's wrong, even if it sounds true.`},
  HALF_RIGHT: {name:`Choosing an answer that is only half right`, fix:`Read EVERY word of an answer. If one part is wrong, the whole answer is wrong. Cover each half and check it separately.`},
  SECTION_SUMMARY: {name:`Telling WHAT a section says instead of WHY it is there`, fix:`Questions about sections and features want the JOB. Use job verbs: introduces, explains, gives an example, shows a cause, compares, concludes.`},
  FEATURE_IGNORE: {name:`Skipping or mixing up text features`, fix:`Headings, captions, diagrams, and sidebars each have their own job. Read them, and make sure you know WHICH feature the question is about.`},
  CLAIM_EVIDENCE: {name:`Mixing up the claim with reasons or evidence`, fix:`Claim = what the author wants you to believe (often "should"). Reasons = why. Evidence = proof (facts, numbers, examples, experts).`},
  REASONING_TYPE: {name:`Mixing up inductive and deductive reasoning`, fix:`INductive = examples coming IN to build a big conclusion (specific → general). DEductive = a big rule coming DOWN to one case (general → specific).`},
  APPEAL_MIX: {name:`Mixing up ethos, pathos, and logos`, fix:`Ethos = TRUST me (experience, expertise, fairness). Pathos = FEEL this (emotions, stories). Logos = THINK about it (facts, numbers, logic).`},
  PURPOSE_SINGLE: {name:`Thinking texts about the same event have the same purpose`, fix:`Two authors can write about the SAME event for DIFFERENT reasons. Look at who wrote it, which details they chose, and how their words feel.`},
  CHAR_SURFACE: {name:`Describing what characters do without explaining how it moves the plot`, fix:`Use a "because... so..." chain: Because the characters said or did ___, ___ happened next. Interaction + effect on the plot.`},
  TOPIC_THEME: {name:`Giving a topic word instead of a theme`, fix:`"Friendship" is a topic. A theme is a whole sentence: what the author says ABOUT friendship. Topic + lesson = theme.`},
  PLOT_THEME: {name:`Stating a theme that is too specific to the story`, fix:`A theme works for real life, not only for this story. Take out character names and plot details. It should fit anyone.`},
  NARRATOR_SAME: {name:`Thinking every narrator knows the same things`, fix:`Each narrator only knows his or her own thoughts. Ask: Who is talking? What do they know? What do they NOT know that the reader knows?`},
  FORM_ONLY: {name:`Confusing poem forms or ignoring the form's effect`, fix:`Check the features (lines, rhyme, who or what is addressed, story or snapshot), name the form, then ask how that form shapes the meaning and feeling.`},
  TIME_PERIOD: {name:`Forgetting how the time period shapes an author's view`, fix:`Ask: What did people know, believe, and value back then? How is that different from now? That explains why the authors see the topic differently.`},
  PART_AB: {name:`Part B evidence that doesn't prove Part A`, fix:`Part B must PROVE your Part A answer. Reread your Part A answer, then pick the quote that shows it best, not just a quote that sounds important.`}
};

// ===== Quick review items, one per misconception (used in Warm-Ups and Fix-It Review) =====
const REVIEW = {
  CONTEXT_SKIP: {s:`“The trail was so <b>arduous</b> that even the strongest hikers stopped every few minutes to catch their breath.” What does <b>arduous</b> mean?`, o:[[`very difficult and tiring`,1],[`long and boring`,`CONTEXT_SKIP`],[`crowded with hikers`,`WORD_MATCH`],[`beautiful and peaceful`,`CONTEXT_SKIP`]], w:`The clue is that even the <b>strongest</b> hikers had to stop to catch their breath. That means the trail was very hard.`},
  CONNOTATION: {s:`Which word gives the most POSITIVE feeling about someone who saves money carefully?`, o:[[`thrifty`,1],[`stingy`,`CONNOTATION`],[`cheap`,`CONNOTATION`],[`greedy`,`CONNOTATION`]], w:`All four words are about money, but <b>thrifty</b> sounds wise and responsible. The others sound negative.`},
  WORD_MATCH: {s:`Text: “Leo’s chores never seemed to end, but he finished each one before dinner.” Which answer best describes Leo?`, o:[[`He is responsible even when he has a lot to do.`,1],[`He never seems to end his dinner.`,`WORD_MATCH`],[`He finishes dinner before chores.`,`WORD_MATCH`],[`He dislikes all of his chores.`,`TRUE_NOT_TEXT`]], w:`The wrong answers reuse words like “never,” “end,” and “dinner,” but they twist the meaning. Leo keeps working until the chores are done.`},
  ROOT_MIX: {s:`<b>re-</b> means “again,” <b>struct</b> means “build,” and <b>-ure</b> means “thing or result.” What is a <b>restructure</b>?`, o:[[`to build or organize something again in a new way`,1],[`to break something apart forever`,`ROOT_MIX`],[`a building that is very old`,`ROOT_MIX`],[`to look at something again`,`ROOT_MIX`]], w:`re (again) + struct (build) = build again. When you restructure, you rebuild or reorganize.`},
  LITERAL_FIG: {s:`“My little brother is a tornado when he gets home from school.” What does this mean?`, o:[[`He moves fast and makes a big mess.`,1],[`He is in danger from bad weather.`,`LITERAL_FIG`],[`He spins in circles to stay dizzy.`,`LITERAL_FIG`],[`He is scared of storms.`,`TRUE_NOT_TEXT`]], w:`A boy can't really be a tornado. The metaphor compares his energy and the mess he leaves to a tornado.`},
  FIG_NO_TONE: {s:`“The empty house watched us with dark, hollow windows.” How does this personification affect the tone?`, o:[[`It makes the house seem creepy and unwelcoming.`,1],[`It shows the author used personification.`,`FIG_NO_TONE`],[`It makes the house seem cheerful.`,`CONNOTATION`],[`It shows the windows were broken.`,`LITERAL_FIG`]], w:`“Watched” and “dark, hollow” make the house seem alive and spooky. Naming the device is not enough; the question asks for the EFFECT.`},
  DETAIL_CENTRAL: {s:`An article explains that otters use rocks as tools, hold hands while sleeping, and keep warm with thick fur. What is its central idea?`, o:[[`Sea otters have special behaviors and features that help them survive.`,1],[`Otters hold hands while they sleep.`,`DETAIL_CENTRAL`],[`Animals live in many places.`,`TOO_BROAD`],[`Otters should be kept as pets.`,`TRUE_NOT_TEXT`]], w:`The correct answer is an umbrella that covers ALL the details. The hand-holding fact is only one detail.`},
  TOO_BROAD: {s:`A story tells how Kai practiced the trumpet every day for a month to make the jazz band. Which theme fits best?`, o:[[`Hard work and practice can help you reach a goal.`,1],[`Life is full of many things.`,`TOO_BROAD`],[`Music.`,`TOPIC_THEME`],[`Kai should play the trumpet.`,`PLOT_THEME`]], w:`“Life is full of many things” could fit any story. The right theme is specific to Kai's lesson but still works for anyone.`},
  TRUE_NOT_TEXT: {s:`Text: “Most bats eat insects, and one bat can eat hundreds of mosquitoes in a night.” Which statement is supported by the text?`, o:[[`Bats can help control insect populations.`,1],[`Bats are dangerous to people.`,`TRUE_NOT_TEXT`],[`All bats drink blood.`,`TRUE_NOT_TEXT`],[`Bats only come out in summer.`,`TRUE_NOT_TEXT`]], w:`Only one answer can be proven with the words in the text: bats eat lots of insects.`},
  HALF_RIGHT: {s:`Text: “Ava was nervous before the play, but once she heard the audience laugh, she relaxed and enjoyed the show.” Which is correct?`, o:[[`Ava started nervous but became relaxed.`,1],[`Ava was nervous during the whole play.`,`HALF_RIGHT`],[`Ava was relaxed, and the audience was bored.`,`HALF_RIGHT`],[`Ava was never nervous at all.`,`TRUE_NOT_TEXT`]], w:`“Ava was nervous” is true at first, but “the whole play” makes it wrong. Every part of an answer must be true.`},
  SECTION_SUMMARY: {s:`An article about volcanoes includes a section called “Living in the Shadow,” which tells about a town that rebuilt after an eruption. Why did the author include it?`, o:[[`to give a real example of how volcanoes affect people's lives`,1],[`to say that a town rebuilt after an eruption`,`SECTION_SUMMARY`],[`to explain how magma forms`,`TRUE_NOT_TEXT`],[`to list the largest volcanoes`,`TRUE_NOT_TEXT`]], w:`The second answer only retells WHAT the section says. The question asks WHY it is there, which is its job: giving a real example.`},
  FEATURE_IGNORE: {s:`An article has a <b>map</b> with the caption “Monarch butterflies travel up to 3,000 miles from Canada to Mexico.” What does this feature help the reader understand?`, o:[[`how far monarchs travel and where they go`,1],[`what monarchs eat during the trip`,`FEATURE_IGNORE`],[`how to raise monarchs at home`,`TRUE_NOT_TEXT`],[`why monarchs are orange`,`FEATURE_IGNORE`]], w:`A map with that caption shows distance and route. Match the answer to what that feature shows.`},
  CLAIM_EVIDENCE: {s:`Which sentence is a CLAIM?`, o:[[`Our town should build a skate park.`,1],[`The nearest skate park is 22 miles away.`,`CLAIM_EVIDENCE`],[`In a survey, 140 students said they skateboard.`,`CLAIM_EVIDENCE`],[`Skateboarding became an Olympic sport in 2021.`,`CLAIM_EVIDENCE`]], w:`A claim is an opinion someone argues for, and it often uses “should.” The other sentences are facts that could be used as evidence.`},
  REASONING_TYPE: {s:`“All mammals breathe air. Whales are mammals. So whales must breathe air.” What type of reasoning is this?`, o:[[`deductive: a general rule applied to one specific case`,1],[`inductive: several examples lead to a general rule`,`REASONING_TYPE`],[`an emotional appeal`,`APPEAL_MIX`],[`a counterclaim`,`CLAIM_EVIDENCE`]], w:`It starts with a big rule (all mammals) and comes DOWN to one case (whales). That's DEductive.`},
  APPEAL_MIX: {s:`“As a firefighter for 20 years, I can tell you that smoke alarms save lives.” Which appeal is this?`, o:[[`ethos`,1],[`pathos`,`APPEAL_MIX`],[`logos`,`APPEAL_MIX`],[`counterclaim`,`CLAIM_EVIDENCE`]], w:`The speaker uses 20 years of experience to earn your TRUST. That's ethos.`},
  PURPOSE_SINGLE: {s:`A coach and a fan both write about the same championship game. The coach writes a report on plays and statistics. The fan writes a blog about the thrill of the final shot. How are their purposes different?`, o:[[`The coach mostly informs; the fan mostly expresses excitement.`,1],[`They both have the same purpose because the game is the same.`,`PURPOSE_SINGLE`],[`The coach entertains; the fan informs with statistics.`,`HALF_RIGHT`],[`Both want to persuade people to buy tickets.`,`TRUE_NOT_TEXT`]], w:`Same event, different purposes. The details each writer chose (statistics or feelings) show the purpose.`},
  CHAR_SURFACE: {s:`Nia teases her friend Jo about her drawing. Jo stops sharing drawings with Nia. Weeks later, Nia apologizes. How does the interaction affect the plot?`, o:[[`The teasing creates a conflict between the friends that the apology later resolves.`,1],[`Nia teases Jo about a drawing.`,`CHAR_SURFACE`],[`Jo likes to draw.`,`CHAR_SURFACE`],[`Nia and Jo were never really friends.`,`TRUE_NOT_TEXT`]], w:`The right answer connects the interaction to an EFFECT on the plot: it creates the conflict and leads to the resolution.`},
  TOPIC_THEME: {s:`Which of these is a THEME, not just a topic?`, o:[[`True courage means doing the right thing even when you are afraid.`,1],[`Courage`,`TOPIC_THEME`],[`Fear and bravery`,`TOPIC_THEME`],[`A girl who is scared`,`TOPIC_THEME`]], w:`A theme is a full-sentence message about life. The others are only topics.`},
  PLOT_THEME: {s:`In a story, Marcus lies about breaking a window, feels guilty for days, and finally tells the truth. Which is the best theme?`, o:[[`Telling the truth can be hard, but it brings relief.`,1],[`Marcus should not break windows.`,`PLOT_THEME`],[`Marcus feels guilty.`,`PLOT_THEME`],[`Windows are fragile.`,`TOPIC_THEME`]], w:`A theme should work for anyone's life, so it doesn't use the character's name or one plot event.`},
  NARRATOR_SAME: {s:`A story switches between two narrators: a lost dog and the girl searching for him. The dog says he is hiding under a porch. Why does this shift matter?`, o:[[`The reader knows where the dog is, but the girl does not, which builds suspense.`,1],[`The girl knows exactly where the dog is.`,`NARRATOR_SAME`],[`Both narrators know everything that happens.`,`NARRATOR_SAME`],[`The dog is not really lost.`,`TRUE_NOT_TEXT`]], w:`Each narrator only knows his or her own part. The reader knows more than either character, and that creates suspense.`},
  FORM_ONLY: {s:`A poem has five lines, an AABBA rhyme scheme, and a bouncy rhythm about a cat who wears a hat. What form is it, and what is the effect?`, o:[[`a limerick, which creates a silly, humorous style`,1],[`a haiku, which creates a calm nature moment`,`FORM_ONLY`],[`an ode, which praises something serious`,`FORM_ONLY`],[`free verse, which has no rhyme`,`FORM_ONLY`]], w:`Five lines + AABBA + bouncy rhythm = limerick. Limericks are made to be funny.`},
  TIME_PERIOD: {s:`A letter from 1920 says children should work on the family farm instead of finishing school. A 2025 article says every child should finish high school. What best explains the difference?`, o:[[`In 1920, many families needed children's labor and fewer jobs required a diploma.`,1],[`The 1920 author did not like children.`,`TRUE_NOT_TEXT`],[`Both authors have the same view.`,`TIME_PERIOD`],[`The time period has nothing to do with their views.`,`TIME_PERIOD`]], w:`What people needed and valued in 1920 shaped that author's view. Time period changes perspective.`},
  PART_AB: {s:`Part A answer: “The narrator is nervous about the first day of school.” Which detail BEST proves it?`, o:[[`“My hands were shaking so badly that I dropped my schedule twice.”`,1],[`“The school was built in 1962.”`,`PART_AB`],[`“The bus was yellow and loud.”`,`PART_AB`],[`“My mom packed a turkey sandwich.”`,`PART_AB`]], w:`Part B has to PROVE Part A. Shaking hands shows nervousness; the other details don't.`}
};

// ===== Category: Reading Across Genres & Vocabulary =====
const LESSONS = [];

LESSONS.push({
  id:`v13`, code:`ELA.6.V.1.3`, cat:`gv`, title:`Word Detective: Context Clues & Connotation`,
  std:`Use context clues, figurative language, word relationships, and background knowledge to figure out what words mean, including their feeling (connotation) and dictionary meaning (denotation).`,
  learn:[
    `<p>On the FAST, you will meet words you have never seen before. Strong readers don't skip them. They <b>investigate</b>. The sentences around a hard word almost always leave clues, just like a detective's crime scene.</p>`,
    `<h4>The 5 kinds of clues</h4><table class="tbl"><tr><th>Clue</th><th>Signal words</th><th>Example</th></tr>
     <tr><td><b>Definition</b></td><td>is, means, refers to, commas, dashes</td><td>The <b>archipelago</b>, a chain of islands, stretched for miles.</td></tr>
     <tr><td><b>Synonym</b></td><td>also, like, similarly, or</td><td>She was <b>exhausted</b>; her brother was also worn out.</td></tr>
     <tr><td><b>Antonym / Contrast</b></td><td>but, however, unlike, instead, although</td><td>Unlike his <b>timid</b> sister, Ray was bold.</td></tr>
     <tr><td><b>Example</b></td><td>such as, for example, including</td><td><b>Reptiles</b>, such as snakes and lizards, ...</td></tr>
     <tr><td><b>Inference</b></td><td>(no signal; use the whole paragraph)</td><td>He <b>devoured</b> three plates in five minutes.</td></tr></table>`,
    `<h4>Denotation vs. Connotation</h4><p><b>Denotation</b> is the dictionary meaning. <b>Connotation</b> is the <em>feeling</em> a word carries: positive, negative, or neutral.</p><p class="trio"><span class="pos">confident 😊</span><span class="neu">sure of herself 😐</span><span class="neg">arrogant 😠</span></p><p>All three have about the same denotation, but they make you feel very differently about the person. FAST loves asking what a word <em>suggests</em> about a character. That's a connotation question.</p>`
  ],
  move:{name:`The Detective Move`, steps:[`<b>Spot</b> the word. Don't skip it!`,`<b>Search</b> one sentence before and one after for a clue. Look for signal words.`,`<b>Say</b> a meaning in your own words before you look at the answers.`,`<b>Swap</b> your meaning into the sentence. Does it still make sense?`,`<b>Sense the feeling.</b> Is the word positive, negative, or neutral? Pick the answer with the same feeling.`]},
  model:{title:`Watch me do it`, passage:[`Marisol had always been <b>gregarious</b>. At every family gathering she drifted from cousin to cousin, laughing and trading stories, while her brother Teo preferred a quiet corner with a book. So when Marisol sat silently through the entire reunion, picking at her plate, her grandmother noticed at once.`],
    think:[
      {s:`Spot`, t:`The word is <b>gregarious</b>. I don't know it, so I'm not going to guess yet.`},
      {s:`Search`, t:`Right after it: “drifted from cousin to cousin, laughing and trading stories.” That's an <b>example</b> clue. Then: “<b>while</b> her brother Teo preferred a quiet corner.” “While” signals a <b>contrast</b>, so gregarious is the opposite of quiet and alone.`},
      {s:`Say`, t:`My meaning: <em>social, loves being around people and talking.</em>`},
      {s:`Swap`, t:`“Marisol had always been <em>social and talkative</em>.” Yes, that makes sense.`},
      {s:`Sense the feeling`, t:`Gregarious feels positive and warm here. And that is why the ending matters: when a gregarious girl sits <em>silently</em>, “picking at her plate,” the author is telling us something is wrong. Word meaning helps me understand the whole story!`}
    ]},
  guided:[
    {s:`“The new principal was known for being <b>meticulous</b>. She checked every lunch schedule twice, labeled every folder by color, and never let a single typo slip into the newsletter.” What does <b>meticulous</b> mean?`,
     o:[[`extremely careful about details`,1],[`strict and unkind to others`,`CONNOTATION`,`Nothing in the text says she was unkind. That adds a negative feeling the author didn't create.`],[`organized only about colors`,`WORD_MATCH`,`“Color” is in the text, but it's just one of three examples. The meaning has to fit ALL the examples.`],[`quick and always in a hurry`,`CONTEXT_SKIP`,`Checking things twice is slow and careful, not hurried. Use the clues!`]],
     h:`Look at the three examples after the word. What do checking twice, labeling folders, and catching typos have in common?`, w:`All three examples show someone who pays close attention to small details. That's an <b>example clue</b>.`},
    {s:`Which word gives the most NEGATIVE feeling about a student who speaks up a lot in class?`,
     o:[[`mouthy`,1],[`confident`,`CONNOTATION`,`“Confident” has a positive feeling.`],[`talkative`,`CONNOTATION`,`“Talkative” is fairly neutral. It just describes someone who talks a lot.`],[`expressive`,`CONNOTATION`,`“Expressive” sounds positive, like someone good at sharing ideas.`]],
     h:`All four words describe someone who talks a lot. Which one would hurt the student's feelings?`, w:`<b>Mouthy</b> suggests someone rude or disrespectful. It has a negative connotation.`},
    {s:`“Unlike his reckless older brother, who once rode a skateboard down the steepest hill in town without a helmet, Andre was <b>prudent</b>.” Which phrase BEST helps you understand <b>prudent</b>?`,
     o:[[`“Unlike his reckless older brother”`,1],[`“rode a skateboard”`,`WORD_MATCH`,`That describes the BROTHER, not Andre.`],[`“the steepest hill in town”`,`CONTEXT_SKIP`,`This tells where the brother rode, not what Andre is like.`],[`“Andre was”`,`CONTEXT_SKIP`,`These words don't give any clue about meaning.`]],
     h:`Look for a signal word that tells you Andre is DIFFERENT from his brother.`, w:`“Unlike” is a <b>contrast</b> signal. If the brother is reckless (careless about danger), then prudent Andre is careful and sensible.`}
  ],
  check:{title:`The Weight of the Trophy`, passages:[{title:`The Weight of the Trophy`, paras:[
    `The robotics lab smelled like solder and old pizza, and Nadia had been staring at the same broken gear for forty minutes. Her teammates had drifted home one by one, but Nadia was <b>tenacious</b>; once a problem got its hooks in her, she refused to let go until it was solved, no matter how late it got.`,
    `“You know the competition is in three days,” said Mr. Okafor, their coach, leaning in the doorway. He did not sound angry, only tired. “At some point you have to decide whether to fix it or rebuild it.”`,
    `Nadia was <b>reluctant</b> to rebuild. Rebuilding meant admitting that the arm she had designed, the arm she had sketched on the back of every math worksheet since September, did not work. She <b>scrutinized</b> the gear again, turning it slowly under the lamp and examining every tooth as if it might confess its secret.`,
    `Then she saw it: a hairline crack, thinner than a strand of hair, running along the base of one tooth. Every time the arm lifted, the crack widened just enough for the gear to slip.`,
    `“It’s not my design,” she whispered, and then louder, “Mr. Okafor, it’s not the design! It’s the part!”`,
    `There was no time to order a replacement. Instead, the team spent the next two afternoons building a <b>makeshift</b> gear out of a spare part from an old kit, a strip of aluminum, and more glue than anyone wanted to admit. It was not pretty. Kiara called it “the Frankengear.”`,
    `On the day of the competition, the arm lifted its first block, then its second, then its third. When the judges announced that Cedar Middle had placed second, the team was <b>jubilant</b>, leaping and shrieking and nearly knocking over the table of trophies. Only Nadia stood still, holding the small silver cup in both hands. It felt heavier than it looked, not because of the metal, but because of every night she had almost given up.`
  ]}],
  qs:[
    {s:`In paragraph 1, what does the word <b>tenacious</b> mean?`, o:[[`determined and unwilling to quit`,1],[`stubborn and rude to others`,`CONNOTATION`],[`tired from working late`,`WORD_MATCH`],[`talented at building robots`,`TRUE_NOT_TEXT`]], w:`The clue “she refused to let go until it was solved” shows determination. Nothing says she was rude.`},
    {type:`ab`, a:{s:`<b>Part A:</b> What does the word <b>reluctant</b> mean as it is used in paragraph 3?`, o:[[`unwilling or hesitant`,1],[`excited and eager`,`CONTEXT_SKIP`],[`unable to understand`,`CONTEXT_SKIP`],[`afraid of getting in trouble`,`TRUE_NOT_TEXT`]], w:`Nadia did not want to rebuild, so she was unwilling.`},
      b:{s:`<b>Part B:</b> Which phrase from paragraph 3 BEST supports the answer to Part A?`, o:[[`“Rebuilding meant admitting that the arm she had designed . . . did not work.”`,1],[`“She scrutinized the gear again”`,`PART_AB`],[`“turning it slowly under the lamp”`,`PART_AB`],[`“sketched on the back of every math worksheet”`,`PART_AB`]], w:`This explains WHY she didn't want to rebuild: it meant admitting her design failed.`}},
    {s:`Read this phrase from paragraph 3: “examining every tooth as if it might confess its secret.” How does this phrase help the reader understand the word <b>scrutinized</b>?`, o:[[`It shows that scrutinized means looked at something very closely.`,1],[`It shows that scrutinized means threw away carelessly.`,`CONTEXT_SKIP`],[`It shows that the gear could really talk.`,`LITERAL_FIG`],[`It shows that scrutinized means fixed quickly.`,`CONTEXT_SKIP`]], w:`“Examining every tooth” is a synonym-style clue: to scrutinize is to examine very carefully.`},
    {s:`Why does the author use the word <b>makeshift</b> and the nickname “the Frankengear” in paragraph 6?`, o:[[`to show the gear was a rough, temporary fix built from whatever the team had`,1],[`to show the team was ashamed and wanted to quit`,`CONNOTATION`],[`to show that the gear looked like a real monster`,`LITERAL_FIG`],[`to show the new gear was better than a store-bought one`,`TRUE_NOT_TEXT`]], w:`Makeshift means put together quickly from what's available. The funny nickname shows the gear was patched together, but the team was proud, not ashamed.`},
    {type:`multi`, n:2, s:`Select <b>TWO</b> words from paragraph 7 that have a positive connotation and show the team's excitement.`, o:[[`jubilant`,1],[`leaping`,1],[`still`,`CONNOTATION`],[`heavier`,`CONNOTATION`],[`given up`,`CONNOTATION`]], w:`<b>Jubilant</b> means full of joy, and <b>leaping</b> shows energetic celebration. The others describe Nadia's quiet, serious feelings.`}
  ]}
});

LESSONS.push({
  id:`v12`, code:`ELA.6.V.1.2`, cat:`gv`, title:`Word Builder: Greek & Latin Roots`,
  std:`Use Greek and Latin roots and affixes (prefixes and suffixes) to figure out the meanings of words.`,
  learn:[
    `<p>Long words are built like LEGO: <b>prefix + root + suffix</b>. If you know the pieces, you can figure out words you've never seen. More than half of English words come from Greek and Latin!</p>`,
    `<h4>Power Roots</h4><div class="chips">
      <span><b>aud</b> hear</span><span><b>bene</b> good</span><span><b>bio</b> life</span><span><b>chron</b> time</span><span><b>cred</b> believe</span><span><b>dict</b> say</span><span><b>duc/duct</b> lead</span><span><b>fract/frag</b> break</span><span><b>geo</b> earth</span><span><b>graph</b> write</span><span><b>ject</b> throw</span><span><b>mal</b> bad</span><span><b>meter</b> measure</span><span><b>mit/miss</b> send</span><span><b>orient</b> direction</span><span><b>phon</b> sound</span><span><b>port</b> carry</span><span><b>rupt</b> break</span><span><b>scrib/script</b> write</span><span><b>spect</b> look</span><span><b>struct</b> build</span><span><b>tele</b> far</span><span><b>therm</b> heat</span><span><b>tract</b> pull</span><span><b>vis/vid</b> see</span></div>`,
    `<h4>Prefixes (front)</h4><div class="chips"><span><b>re-</b> again/back</span><span><b>pre-</b> before</span><span><b>in-/im-</b> not or into</span><span><b>un-</b> not</span><span><b>dis-</b> not/opposite</span><span><b>mis-</b> wrongly</span><span><b>sub-</b> under</span><span><b>inter-</b> between</span><span><b>trans-</b> across</span><span><b>ex-</b> out</span><span><b>retro-</b> back</span><span><b>de-</b> undo/down</span></div>
     <h4>Suffixes (end)</h4><div class="chips"><span><b>-able/-ible</b> can be</span><span><b>-less</b> without</span><span><b>-ful/-ous</b> full of</span><span><b>-tion/-sion</b> act or state</span><span><b>-ist/-er</b> person who</span><span><b>-ology</b> study of</span><span><b>-ity</b> state of</span><span><b>-ment</b> result</span></div>`,
    `<p class="tip">⚠️ <b>Watch out:</b> some words just <em>look</em> like they have a root. “Visit” really does come from vis (see), but “pretty” has nothing to do with pre-! Always check your meaning in the sentence.</p>`
  ],
  move:{name:`The Builder Move`, steps:[`<b>Break</b> the word into prefix, root, and suffix.`,`<b>Define</b> each piece.`,`<b>Build</b> a meaning by putting the pieces together. (It often helps to start with the suffix: <em>-able</em> = “can be ___.”)`,`<b>Check</b> it in the sentence. Does it fit the context?`]},
  model:{title:`Watch me do it`, passage:[`Jaden stared at his science test score, <b>incredulous</b>. He checked the name at the top twice. After weeks of failing quizzes, he had earned a 96. His teacher smiled at the <b>interruption</b> when he gasped out loud in the middle of class.`],
    think:[
      {s:`Break`, t:`<b>in</b> + <b>cred</b> + <b>ulous</b>.`},
      {s:`Define`, t:`in- = not. cred = believe (like <em>credit</em> or <em>credible</em>). -ulous = full of / tending to.`},
      {s:`Build`, t:`“Not believing.” Incredulous means unable to believe something.`},
      {s:`Check`, t:`He checks his name <em>twice</em> because he can't believe it. ✔ Perfect fit.`},
      {s:`Second word`, t:`<b>inter</b> (between) + <b>rupt</b> (break) + <b>tion</b> (the act of). An interruption is the act of breaking in between, like a gasp in the middle of class. ✔`}
    ]},
  guided:[
    {s:`The root <b>port</b> means “carry.” Which word means “able to be carried”?`, o:[[`portable`,1],[`report`,`ROOT_MIX`,`Report = re (back) + port (carry): to carry news back. No “-able.”`],[`import`,`ROOT_MIX`,`Import = carry INTO a country. Check the suffix: you need “able to be.”`],[`porter`,`ROOT_MIX`,`-er means a PERSON who carries, not “able to be carried.”`]], h:`Which suffix means “can be”?`, w:`port (carry) + -able (can be) = can be carried.`},
    {s:`The prefix <b>mal-</b> means “bad.” What does <b>malfunction</b> most likely mean?`, o:[[`to work badly or fail to work correctly`,1],[`to work very hard`,`ROOT_MIX`,`That ignores the meaning of mal-.`],[`to stop working forever and be destroyed`,`TOO_BROAD`,`That goes too far. Mal- means badly, not destroyed.`],[`to work again after a break`,`ROOT_MIX`,`“Again” is re-, not mal-.`]], h:`mal (bad) + function (work).`, w:`mal (bad) + function (work) = works badly.`},
    {s:`“The coach's speech was so <b>inaudible</b> that the players in the back row just shrugged at one another.” What does <b>inaudible</b> mean?`, o:[[`unable to be heard`,1],[`much too loud`,`ROOT_MIX`,`Don't forget the prefix in- (not)!`],[`boring and too long`,`CONTEXT_SKIP`,`Shrugging fits, but the roots tell you it's about HEARING.`],[`spoken in another language`,`CONTEXT_SKIP`,`Use the roots: aud means hear.`]], h:`in (not) + aud (hear) + ible (can be).`, w:`in (not) + aud (hear) + ible (can be) = can't be heard. The players shrug because they couldn't hear.`}
  ],
  check:{title:`Secrets Under the Spring`, passages:[{title:`Secrets Under the Spring`, paras:[
    `Most people visit Florida’s freshwater springs to swim, paddle, or watch manatees drift through the clear blue water. A small group of scientists, however, visits for a very different reason. They are underwater archaeologists, and Florida's springs and rivers are among the best places in North America to find clues about people who lived here more than ten thousand years ago.`,
    `When the last Ice Age ended, sea levels rose, and land that ancient people had once walked across became <b>submerged</b>. Today, tools and animal bones that once sat on dry ground rest beneath several meters of water and thick layers of mud. The cool, low-oxygen water slows decay, so objects that would have crumbled long ago on land can survive for thousands of years below the surface.`,
    `Working underwater is slow and demanding. Divers must manage their air supply, fight strong currents, and work in areas where <b>visibility</b> can drop to just a few centimeters when mud is stirred up. Instead of shovels, archaeologists use a hose that gently vacuums away mud so that nothing fragile is damaged. Every <b>fragment</b>, from a chipped stone blade to a broken piece of tusk, is measured, photographed, and mapped before it is moved.`,
    `Why such care? Because an object’s location is often more important than the object itself. Layers of mud and sand build up over time, with older layers on the bottom and newer layers on top. By recording exactly which layer an object came from, scientists can build a <b>chronology</b>, a timeline that shows the order in which events happened. A stone tool found beneath the bones of an extinct mastodon tells a very different story from one found above them.`,
    `Once the objects are safely recovered, they are transported to a laboratory, where they are kept wet so they do not crack as they dry. There, geologists study the layers of mud, biologists study ancient seeds and pollen, and archaeologists look for tiny marks that show how a bone was cut or a tool was sharpened. No single scientist can tell the whole story; the past is a puzzle that requires many different experts.`,
    `In <b>retrospect</b>, it seems almost unbelievable that so much of the past has been preserved under water that thousands of people swim above every summer. The next time you float in a Florida spring, remember that the clear water below you may be guarding secrets older than the pyramids.`
  ]}],
  qs:[
    {s:`The prefix <b>sub-</b> means “under.” What does <b>submerged</b> mean in paragraph 2?`, o:[[`covered by water`,1],[`dried out by the sun`,`ROOT_MIX`],[`pushed off to the side`,`CONTEXT_SKIP`],[`raised up higher`,`ROOT_MIX`]], w:`sub (under) + merge (dip/plunge): the land went under the water when sea levels rose.`},
    {s:`The root <b>vis</b> means “see.” What does <b>visibility</b> mean in paragraph 3?`, o:[[`how far or how clearly a person can see`,1],[`how many visitors come to the spring`,`ROOT_MIX`],[`how deep the water is`,`TRUE_NOT_TEXT`],[`how cold the water feels`,`CONTEXT_SKIP`]], w:`vis (see) + ibility (ability/state): how well you can see. Stirred-up mud makes it hard to see.`},
    {type:`ab`, a:{s:`<b>Part A:</b> The root <b>chron</b> means “time.” What does <b>chronology</b> mean in paragraph 4?`, o:[[`a timeline showing the order of events`,1],[`a list of the oldest tools only`,`HALF_RIGHT`],[`the study of animal bones`,`ROOT_MIX`],[`a type of mud layer`,`WORD_MATCH`]], w:`chron (time) + ology: an organized account of time, a timeline.`},
      b:{s:`<b>Part B:</b> Which phrase from paragraph 4 BEST helps confirm the answer to Part A?`, o:[[`“a timeline that shows the order in which events happened”`,1],[`“Layers of mud and sand build up over time”`,`PART_AB`],[`“the bones of an extinct mastodon”`,`PART_AB`],[`“more important than the object itself”`,`PART_AB`]], w:`This is a definition clue, set off by a comma, right after the word.`}},
    {s:`The root <b>frag</b> means “break.” Based on its root and the context, a <b>fragment</b> (paragraph 3) is most likely`, o:[[`a broken piece of something`,1],[`a whole, complete object`,`ROOT_MIX`],[`a tool used for digging`,`CONTEXT_SKIP`],[`a map of the dig site`,`WORD_MATCH`]], w:`frag (break) + ment (result): the result of breaking, a piece. The examples (“chipped stone,” “broken piece of tusk”) confirm it.`},
    {s:`<b>retro-</b> means “back” and <b>spect</b> means “look.” What does “in <b>retrospect</b>” mean in paragraph 6?`, o:[[`looking back on it`,1],[`looking ahead to the future`,`ROOT_MIX`],[`looking very closely at something small`,`ROOT_MIX`],[`with great respect`,`WORD_MATCH`]], w:`retro (back) + spect (look) = looking back. The author looks back at everything the passage explained.`},
    {type:`multi`, n:2, s:`The suffix <b>-logist</b> means “a person who studies.” Select <b>TWO</b> words from paragraph 5 that name people who study something.`, o:[[`geologists`,1],[`biologists`,1],[`laboratory`,`ROOT_MIX`],[`recovered`,`ROOT_MIX`],[`sharpened`,`CONTEXT_SKIP`]], w:`geo (earth) + logist = person who studies the earth; bio (life) + logist = person who studies living things. “Laboratory” looks similar, but it means a place to work (labor).`}
  ]}
});

LESSONS.push({
  id:`r31`, code:`ELA.6.R.3.1`, cat:`gv`, title:`Figurative Language: Tone & Meaning`,
  std:`Explain how figurative language contributes to tone and meaning in a text.`,
  learn:[
    `<p><b>Figurative language</b> says something that isn't literally true in order to make an idea stronger or create a feeling. FAST won't just ask you to <em>name</em> it. It asks how it adds to <b>tone</b> (the author's attitude or feeling) and <b>meaning</b>.</p>`,
    `<table class="tbl"><tr><th>Type</th><th>What it is</th><th>Example</th></tr>
     <tr><td><b>Simile</b></td><td>compares using <em>like</em> or <em>as</em></td><td>quiet as a held breath</td></tr>
     <tr><td><b>Metaphor</b></td><td>says one thing IS another</td><td>The classroom was a zoo.</td></tr>
     <tr><td><b>Personification</b></td><td>gives human actions to non-human things</td><td>The wind whispered.</td></tr>
     <tr><td><b>Hyperbole</b></td><td>huge exaggeration</td><td>I've told you a million times!</td></tr>
     <tr><td><b>Idiom</b></td><td>a saying whose meaning differs from its words</td><td>break the ice</td></tr></table>`,
    `<h4>Tone words to know</h4><div class="chips"><span>hopeful</span><span>tense</span><span>playful</span><span>gloomy</span><span>admiring</span><span>bitter</span><span>nostalgic</span><span>ominous</span><span>reassuring</span><span>anxious</span><span>calm</span><span>sarcastic</span></div>`
  ],
  move:{name:`The N-E-T Move`, steps:[`<b>N</b>ame it: what two things are being compared?`,`<b>E</b>xplain it: what does it REALLY mean (not literally)?`,`<b>T</b>one it: what feeling does it create, and why did the author choose it? Pick the answer that has the meaning AND the effect.`]},
  model:{title:`Watch me do it`, passage:[`The hallway on the first day of middle school was a river in flood, and I was a paper boat.`],
    think:[
      {s:`Name`, t:`It's a metaphor (no “like” or “as”). The hallway is compared to a flooding river, and the narrator is compared to a paper boat.`},
      {s:`Explain`, t:`There is no real river. A flood is rushing, crowded, and powerful. A paper boat is small, fragile, and pushed wherever the water goes. So the hallway is packed and pushing, and the narrator feels tiny and out of control.`},
      {s:`Tone`, t:`The tone is <b>anxious and overwhelmed</b>. The author chose a flood instead of just saying “the hall was crowded” so we would FEEL how scared the narrator is.`}
    ]},
  guided:[
    {s:`“The old car groaned up the hill, coughing smoke at every turn.” The personification mainly helps the reader understand that`, o:[[`the car is old and struggling to climb`,1],[`the car is sick and needs a doctor`,`LITERAL_FIG`,`Cars can't really get sick. What do “groaned” and “coughing” suggest about how it runs?`],[`the driver is angry`,`TRUE_NOT_TEXT`,`The sentence doesn't mention the driver's feelings.`],[`the author used personification`,`FIG_NO_TONE`,`True, but that's just naming it. What does it SHOW?`]], h:`What does a person sound like when they groan and cough while doing something hard?`, w:`Groaning and coughing are what a tired person does during hard work, so the car is straining.`},
    {s:`“I've told you a <b>million</b> times to close the door!” What tone does this hyperbole create?`, o:[[`frustrated`,1],[`calm`,`FIG_NO_TONE`,`An exaggeration like this is not calm. Think about the speaker's feeling.`],[`exact, because the speaker counted carefully`,`LITERAL_FIG`,`Nobody really said it a million times. That's the exaggeration!`],[`joyful`,`FIG_NO_TONE`,`Would you be joyful if you had to keep repeating yourself?`]], h:`Did the speaker really say it a million times? Why exaggerate?`, w:`The exaggeration shows the speaker is fed up and frustrated.`},
    {s:`“Her words were a warm blanket on a winter night.” Which BEST explains the metaphor?`, o:[[`Her words comforted the listener.`,1],[`She gave the listener a blanket.`,`LITERAL_FIG`,`No real blanket here! What does a warm blanket feel like?`],[`Her words went on too long.`,`TRUE_NOT_TEXT`,`Nothing suggests that.`],[`It is a simile because it compares two things.`,`FIG_NO_TONE`,`It has no “like” or “as,” so it's a metaphor. And the question asks for meaning.`]], h:`How do you feel under a warm blanket on a cold night?`, w:`A warm blanket on a cold night = comfort and safety. Her words made the listener feel comforted.`}
  ],
  check:{title:`Storm Season`, passages:[{title:`Storm Season`, paras:[
    `By Thursday afternoon, the sky over Apalachicola had turned the color of a bruise, and the air was so thick you could have spread it on toast. Lucía stood on the porch beside her grandmother and watched the palm trees bow and straighten, bow and straighten, like nervous dancers rehearsing for a show they did not want to perform.`,
    `“Plywood,” said Abuela Rosa, already walking toward the shed. She was a lighthouse in a storm, steady and unshaken, while the rest of the neighborhood buzzed like a kicked hive. Car doors slammed. Radios crackled with the same warning again and again. Mr. Delgado next door had been hammering for so long that Lucía was sure he had nailed every board in Florida to his windows.`,
    `Together they carried the boards to the front of the house. Abuela held each one in place while Lucía drove in the nails, her arms aching. The wind tugged at her shirt and whispered through the gaps in the fence, impatient, as if it wanted to come inside and look around.`,
    `That night the storm arrived. It did not knock. It pounded on the shutters with a thousand fists and howled down the chimney until the whole house seemed to tremble. Lucía curled up on the couch, her heart a trapped bird beating against her ribs.`,
    `Abuela sat beside her with a flashlight and a deck of cards. “The wind is loud,” she said, shuffling, “but loud is not the same as strong. This house has heard worse songs than this one.” She dealt the cards as calmly as if they were sitting at the kitchen table on a quiet Sunday.`,
    `By morning, the world outside was a mess of branches and scattered leaves, but the house still stood, and so did they. Lucía stepped onto the porch, blinking in the gray light, and realized that the storm had been a bully: loud, frightening, and, in the end, smaller than it had wanted her to believe.`
  ]}],
  qs:[
    {s:`In paragraph 1, the author writes that “the air was so thick you could have spread it on toast.” This hyperbole mainly helps the reader understand`, o:[[`how heavy and humid the air felt before the storm`,1],[`that Lucía was hungry for breakfast`,`LITERAL_FIG`],[`that the air was full of smoke`,`TRUE_NOT_TEXT`],[`that the author used exaggeration`,`FIG_NO_TONE`]], w:`Air can't really be spread on toast. The exaggeration shows how thick and muggy the air was before the hurricane.`},
    {type:`ab`, a:{s:`<b>Part A:</b> In paragraph 2, what does the metaphor “She was a lighthouse in a storm” suggest about Abuela Rosa?`, o:[[`She is calm and steady, and others can depend on her.`,1],[`She works at a lighthouse on the coast.`,`LITERAL_FIG`],[`She is secretly terrified of the storm.`,`TRUE_NOT_TEXT`],[`She is bright, loud, and cheerful.`,`HALF_RIGHT`]], w:`A lighthouse stands firm and guides people through danger. Abuela is steady while everyone else panics.`},
      b:{s:`<b>Part B:</b> Which detail from paragraph 2 BEST supports the answer to Part A?`, o:[[`“steady and unshaken, while the rest of the neighborhood buzzed like a kicked hive”`,1],[`“Radios crackled with the same warning again and again.”`,`PART_AB`],[`“Car doors slammed.”`,`PART_AB`],[`“Mr. Delgado next door had been hammering for so long”`,`PART_AB`]], w:`“Steady and unshaken” directly describes Abuela, and the contrast with the “kicked hive” shows she stays calm while others panic.`}},
    {s:`In paragraph 4, the author writes, “It did not knock. It pounded on the shutters with a thousand fists.” How does this personification contribute to the tone?`, o:[[`It creates a frightening, violent tone by making the storm seem like an attacker.`,1],[`It shows that the storm was polite at first.`,`LITERAL_FIG`],[`It shows that a visitor was at the door.`,`LITERAL_FIG`],[`It creates a peaceful, sleepy tone.`,`FIG_NO_TONE`]], w:`Pounding with “a thousand fists” makes the storm seem like a violent person trying to break in. That makes the tone scary.`},
    {s:`What does the phrase “her heart a trapped bird beating against her ribs” (paragraph 4) show about Lucía?`, o:[[`She is very frightened, and her heart is racing.`,1],[`A bird flew into the house during the storm.`,`LITERAL_FIG`],[`She is excited to see birds after the storm.`,`TRUE_NOT_TEXT`],[`She is sick and needs to see a doctor.`,`LITERAL_FIG`]], w:`A trapped bird flutters wildly. Her heart is pounding fast because she is scared.`},
    {s:`How does the metaphor in paragraph 6 comparing the storm to a bully contribute to the meaning of the story?`, o:[[`It shows Lucía realizes that fear made the storm seem bigger than it was, so she feels braver.`,1],[`It shows that a bully at school hurt Lucía during the storm.`,`LITERAL_FIG`],[`It shows that the storm destroyed their house.`,`TRUE_NOT_TEXT`],[`It shows that the author knows a lot about bullies.`,`FIG_NO_TONE`]], w:`Bullies seem scary but are “smaller than they want you to believe.” Lucía learns what Abuela said: loud is not the same as strong. The tone shifts from fear to confidence.`}
  ]}
});

LESSONS.push({
  id:`r34`, code:`ELA.6.R.3.4`, cat:`gv`, title:`Rhetorical Appeals: Ethos, Pathos, Logos`,
  std:`Identify rhetorical appeals (ethos, pathos, logos) in a text.`,
  learn:[
    `<p>When authors want to convince you, they <b>appeal</b> to you in three ways. Think about what the author wants you to do: <b>TRUST</b>, <b>FEEL</b>, or <b>THINK</b>.</p>`,
    `<div class="appeals"><div><h4>Ethos 🤝 TRUST me</h4><p>Credibility: experience, expertise, titles, being fair and respectful.</p><p class="ex">“As a nurse for 15 years...”</p></div><div><h4>Pathos ❤️ FEEL this</h4><p>Emotion: personal stories, vivid words, hopes, fears, pictures in your mind.</p><p class="ex">“Imagine a puppy shivering alone in the rain...”</p></div><div><h4>Logos 🧠 THINK about it</h4><p>Logic: facts, statistics, data, cause and effect, reasoning.</p><p class="ex">“Shelters took in 6,000 animals last year.”</p></div></div>`,
    `<p class="tip">⚠️ <b>Tricky part:</b> Sometimes one sentence uses two appeals. Ask: what does it <b>MAINLY</b> do? A number is usually logos. An expert's title is ethos. A sad or hopeful story is pathos. Also, being fair to the other side (“I respect...”) builds <b>ethos</b>, because it makes the author seem reasonable and trustworthy.</p>`
  ],
  move:{name:`The Trust-Feel-Think Move`, steps:[`Read the sentence or paragraph.`,`Ask: Is the author trying to make me <b>TRUST</b> them, <b>FEEL</b> something, or <b>THINK</b> logically?`,`Find the proof word: a title or experience (ethos), an emotional word or story (pathos), a number or reason (logos).`,`Pick the appeal it MAINLY uses.`]},
  model:{title:`Watch me do it`, passage:[`(1) “I have volunteered at the Seminole County animal shelter every weekend for six years.” (2) “Last year, the shelter was so full that 300 dogs had to be sent to other counties.” (3) “Every night, I think about a gray puppy named Biscuit, pressing his nose against the cage, waiting for someone who never came.”`],
    think:[
      {s:`Sentence 1`, t:`Six years of volunteering = experience. The author wants me to <b>TRUST</b> her. → <b>Ethos</b>.`},
      {s:`Sentence 2`, t:`“300 dogs” is a number, a fact. She wants me to <b>THINK</b> about how big the problem is. → <b>Logos</b>.`},
      {s:`Sentence 3`, t:`A puppy with a name, pressing his nose against the cage... That makes me <b>FEEL</b> sad. → <b>Pathos</b>.`}
    ]},
  guided:[
    {s:`“According to the CDC, children who sleep 9 to 12 hours a night have better attention and memory.” Which appeal is used?`, o:[[`logos`,1],[`pathos`,`APPEAL_MIX`,`There's no emotional story here.`],[`ethos`,`APPEAL_MIX`,`The CDC is a trusted source, but the sentence MAINLY gives facts and data.`],[`a counterclaim`,`CLAIM_EVIDENCE`,`A counterclaim is the other side's argument.`]], h:`Is this a feeling, a fact, or the author's experience?`, w:`It mainly gives research facts about sleep, so it's logos. (The source helps too, but the main job is the data.)`},
    {s:`“Picture a little girl standing at the edge of the pool, too afraid to jump in while all her friends splash and laugh.” Which appeal is used?`, o:[[`pathos`,1],[`logos`,`APPEAL_MIX`,`No facts or numbers here.`],[`ethos`,`APPEAL_MIX`,`The author isn't sharing credentials.`],[`deductive reasoning`,`REASONING_TYPE`,`There's no general rule applied to a case.`]], h:`How does this make you FEEL?`, w:`The image of a scared, left-out girl makes you feel sympathy. That's pathos.`},
    {s:`“I understand why some parents worry about the cost, and their concern is fair.” Which appeal does this sentence MAINLY build?`, o:[[`ethos, because it shows the author is fair and reasonable`,1],[`pathos, because it mentions worried parents`,`APPEAL_MIX`,`It mentions worry, but the author's goal is to seem fair, so you trust them.`],[`logos, because cost is about money`,`APPEAL_MIX`,`No numbers or reasoning are given.`],[`logos, because it proves the claim`,`CLAIM_EVIDENCE`,`This sentence doesn't prove anything; it shows respect for the other side.`]], h:`When someone is fair to the other side, do you trust them more or less?`, w:`Being respectful to people who disagree makes the author seem trustworthy. That builds ethos.`}
  ],
  check:{title:`Keep Our Library Open`, passages:[{title:`Letter to the Editor: Keep Our Library Open on Saturdays`, note:`(This letter was written for practice. The people and numbers are made up.)`, paras:[
    `For thirty-one years, I worked as a children’s librarian at the Harbor Street Library. I have shelved more books, led more story times, and helped with more science-fair projects than I can count. So when I read that the city council plans to close the library on Saturdays to save money, I knew I had to speak up.`,
    `Consider the numbers. According to the library’s own records, Saturday is its busiest day of the week, with an average of 640 visitors, nearly twice as many as any weekday. More than a third of those Saturday visitors are children and teenagers. The council estimates that closing on Saturdays would save about $48,000 a year, less than one percent of the city’s yearly budget. Cutting the library’s busiest day to save such a small amount simply does not add up.`,
    `But numbers cannot capture everything. I still think about a nine-year-old girl named Ana who came in every Saturday with her little brother while their mother worked a double shift at the hospital. At first, Ana would only flip through picture books, embarrassed that she struggled to read. Week after week, we read together at the corner table by the window. By the end of the year, she was reading chapter books aloud to her brother. Where will the next Ana go on a Saturday if our doors are locked?`,
    `I understand that the council must make difficult choices, and I respect the hard work its members do. However, a library is not a luxury. For many families, it is the only place that offers free internet, a quiet place to study, and a trained adult who can help a child find the right book.`,
    `I urge the council to find savings elsewhere and to keep the Harbor Street Library open on Saturdays. Our children are counting on us.<br><br><em>Sincerely,<br>Margaret Ellison, retired children’s librarian</em>`
  ]}],
  qs:[
    {s:`Paragraph 1 MAINLY appeals to`, o:[[`ethos, by showing the author's thirty-one years of experience`,1],[`pathos, by making readers feel sorry for the author`,`APPEAL_MIX`],[`logos, by giving statistics about visitors`,`APPEAL_MIX`],[`logos, by explaining the city's budget`,`APPEAL_MIX`]], w:`Thirty-one years as a children's librarian makes her an expert we can TRUST.`},
    {type:`ab`, a:{s:`<b>Part A:</b> Which appeal does paragraph 2 MAINLY use?`, o:[[`logos`,1],[`ethos`,`APPEAL_MIX`],[`pathos`,`APPEAL_MIX`],[`a counterclaim`,`CLAIM_EVIDENCE`]], w:`“Consider the numbers.” The paragraph is full of data and reasoning.`},
      b:{s:`<b>Part B:</b> Which detail BEST supports the answer to Part A?`, o:[[`“an average of 640 visitors, nearly twice as many as any weekday”`,1],[`“I knew I had to speak up.”`,`PART_AB`],[`“Our children are counting on us.”`,`PART_AB`],[`“I respect the hard work its members do.”`,`PART_AB`]], w:`A statistic is logical evidence.`}},
    {s:`How does the story about Ana in paragraph 3 contribute to the author's argument?`, o:[[`It appeals to emotion by showing how the library changed one child's life, making the closure feel personal.`,1],[`It gives statistical proof that the library is busy on Saturdays.`,`APPEAL_MIX`],[`It proves the author is an expert librarian.`,`APPEAL_MIX`],[`It explains why Ana's mother worked at the hospital.`,`DETAIL_CENTRAL`]], w:`The story of Ana makes readers care. That's pathos. The question at the end makes you imagine a child with nowhere to go.`},
    {s:`In paragraph 4, the author writes, “I understand that the council must make difficult choices, and I respect the hard work its members do.” This sentence MAINLY builds`, o:[[`ethos, because it shows the author is fair and respectful, so readers trust her`,1],[`pathos, because it makes readers angry at the council`,`APPEAL_MIX`],[`logos, because it gives facts about the budget`,`APPEAL_MIX`],[`a weakness, because it agrees the library should close`,`TRUE_NOT_TEXT`]], w:`Being fair to the other side makes her more trustworthy. That's ethos.`},
    {type:`multi`, n:2, s:`Select <b>TWO</b> sentences that MAINLY appeal to pathos.`, o:[[`“Where will the next Ana go on a Saturday if our doors are locked?”`,1],[`“Our children are counting on us.”`,1],[`“less than one percent of the city’s yearly budget”`,`APPEAL_MIX`],[`“For thirty-one years, I worked as a children’s librarian”`,`APPEAL_MIX`],[`“Saturday is its busiest day of the week”`,`APPEAL_MIX`]], w:`Both make readers FEEL worry and responsibility for children. The others are logos or ethos.`}
  ]}
});
